<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cup Drop</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: sans-serif;
    color: #eee;
  }
  h1 { margin: 8px 0; }
  #hud { margin-bottom: 8px; font-size: 20px; }
  canvas {
    border: 2px solid #444;
    border-radius: 6px;
  }
  #msg {
    margin-top: 10px;
    height: 24px;
    color: #ffe066;
    font-weight: bold;
    text-align: center;
  }
</style>
</head>
<body>
<h1>Cup Drop</h1>
<div id="hud">Falling through the cups...</div>
<canvas id="game" width="800" height="450"></canvas>
<div id="msg">Arrows/AD to steer through each hole. Land on the island, then beat the dragon!</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, duration, type, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = volume || 0.15;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}
function playThud() { beep(150, 0.06, 'square', 0.08); }
function playThrough() { beep(750, 0.07, 'sine', 0.11); }
function playLand() { beep(500, 0.1, 'sine', 0.14); setTimeout(() => beep(700, 0.12, 'sine', 0.14), 90); }
function playStomp() { beep(320, 0.09, 'square', 0.16); setTimeout(() => beep(200, 0.1, 'square', 0.13), 60); }
function playFireHit() { beep(220, 0.15, 'sawtooth', 0.15); }
function playWin() {
  [660, 880, 990, 1320, 1500].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'sine', 0.16), i * 120));
}

const NUM_CUPS = 12;
const fallSpeed = 2.6;
const moveSpeed = 4.2;
const playerR = 13;

function buildCups() {
  const cups = [];
  let wy = 260;
  for (let i = 0; i < NUM_CUPS; i++) {
    const gapW = Math.max(150, 230 - i * 7);
    const center = 130 + ((i * 137) % (W - 260)) ;
    let gapX1 = Math.max(40, Math.min(W - 40 - gapW, center - gapW / 2));
    cups.push({ worldY: wy, gapX1, gapX2: gapX1 + gapW, passed: false, idx: i });
    wy += 210;
  }
  const islandY = wy + 120;
  return { cups, islandY };
}

let course = buildCups();
let phase = 'falling';
let player = { x: W / 2, y: 0, worldY: 0 };
let t = 0;
let keys = { left: false, right: false, jump: false };
let particles = [];

let dragon, fireballs, dragonHits, boss;

document.addEventListener('keydown', e => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
    e.preventDefault();
    keys.jump = true;
    if (phase === 'win') resetAll();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.jump = false;
});

function resetAll() {
  course = buildCups();
  phase = 'falling';
  player = { x: W / 2, y: 0, worldY: 0 };
  particles = [];
  document.getElementById('hud').textContent = 'Falling through the cups...';
  document.getElementById('msg').textContent = 'Arrows/AD to steer through each hole. Land on the island, then beat the dragon!';
}

function startBoss() {
  phase = 'boss';
  boss = {
    player: { x: 100, y: 0, vx: 0, vy: 0, onGround: false, facing: 1 },
    groundY: 380,
    gravity: 0.5,
    jumpPower: -13
  };
  boss.player.y = boss.groundY - 28;
  dragon = { x: 550, baseY: 268, y: 268, dir: 1, hitFlash: 0, invuln: 0 };
  fireballs = [];
  dragonHits = 0;
  document.getElementById('hud').textContent = 'Dragon Health: 10 / 10';
  document.getElementById('msg').textContent = 'Jump on the dragon\'s head to hit it! Fire just bounces you back.';
}

function updateFalling() {
  if (keys.left) player.x -= moveSpeed;
  if (keys.right) player.x += moveSpeed;
  player.x = Math.max(playerR, Math.min(W - playerR, player.x));

  const next = course.cups.find(c => !c.passed);
  let blocked = false;
  if (next) {
    const willReach = player.worldY + fallSpeed >= next.worldY;
    const inGap = player.x > next.gapX1 + playerR * 0.6 && player.x < next.gapX2 - playerR * 0.6;
    if (willReach && !inGap) {
      player.worldY = next.worldY;
      blocked = true;
    } else if (willReach && inGap) {
      next.passed = true;
      playThrough();
      for (let i = 0; i < 8; i++) {
        particles.push({ x: player.x, y: 60, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, life: 20 });
      }
    }
  }
  if (!blocked) {
    player.worldY += fallSpeed;
  }

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  if (player.worldY >= course.islandY) {
    phase = 'landed';
    playLand();
    setTimeout(startBoss, 1000);
  }
}

function updateBoss() {
  const p = boss.player;
  if (keys.left) { p.vx = -3.8; p.facing = -1; }
  else if (keys.right) { p.vx = 3.8; p.facing = 1; }
  else p.vx = 0;

  if (keys.jump && p.onGround) {
    p.vy = boss.jumpPower;
    p.onGround = false;
  }

  const prevBottom = p.y + 28;
  p.vy += boss.gravity;
  p.x += p.vx;
  p.y += p.vy;
  p.x = Math.max(20, Math.min(W - 40, p.x));

  if (p.y + 28 >= boss.groundY && prevBottom <= boss.groundY + 2 && p.vy >= 0) {
    p.y = boss.groundY - 28;
    p.vy = 0;
    p.onGround = true;
  }

  dragon.x += dragon.dir * 1.4;
  if (dragon.x > 680) dragon.dir = -1;
  if (dragon.x < 300) dragon.dir = 1;
  dragon.y = dragon.baseY + Math.sin(t * 0.04) * 8;
  if (dragon.invuln > 0) dragon.invuln--;
  if (dragon.hitFlash > 0) dragon.hitFlash--;

  const dragonTop = dragon.y - 40;
  const overlapX = p.x + 22 > dragon.x - 40 && p.x < dragon.x + 45;
  const overlapY = p.y + 28 > dragonTop && p.y < dragon.y + 10;
  if (overlapX && overlapY && dragon.invuln === 0) {
    if (p.vy > 0 && prevBottom <= dragonTop + 14) {
      dragonHits++;
      dragon.invuln = 45;
      dragon.hitFlash = 20;
      p.vy = -8;
      playStomp();
      document.getElementById('hud').textContent = 'Dragon Health: ' + (10 - dragonHits) + ' / 10';
      if (dragonHits >= 10) {
        phase = 'win';
        playWin();
        document.getElementById('msg').textContent = 'You defeated the dragon! Press Space to play again';
      }
    } else {
      p.vx = p.x < dragon.x ? -5 : 5;
      p.vy = -5;
    }
  }

  if (t % 150 === 0) {
    const dir = p.x < dragon.x ? -1 : 1;
    for (let i = 0; i < 3; i++) {
      fireballs.push({ x: dragon.x + 70, y: dragon.y - 18, vx: dir * (3 + i * 0.4), life: 120 });
    }
  }
  fireballs.forEach(f => { f.x += f.vx; f.life--; });
  fireballs = fireballs.filter(f => f.life > 0);
  fireballs.forEach(f => {
    const dx = (p.x + 11) - f.x, dy = (p.y + 14) - f.y;
    if (Math.sqrt(dx * dx + dy * dy) < 18 && f.life > 0) {
      f.life = 0;
      p.vx = dx > 0 ? 4 : -4;
      p.vy = -5;
      playFireHit();
    }
  });

  if (p.y > H + 150) {
    p.y = boss.groundY - 28;
    p.vy = 0;
    p.x = 100;
  }
}

function update() {
  t++;
  if (phase === 'falling') updateFalling();
  else if (phase === 'boss') updateBoss();
}

function drawFalling() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#bfe9ff');
  grad.addColorStop(1, '#eaf7ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 5; i++) {
    const cy = ((i * 130 + player.worldY * 0.6) % (H + 200)) - 100;
    ctx.beginPath();
    ctx.ellipse(100 + i * 140, cy, 40, 16, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const screenPlayerY = 90;
  course.cups.forEach(c => {
    const sy = screenPlayerY + (c.worldY - player.worldY);
    if (sy < -40 || sy > H + 40) return;
    ctx.fillStyle = c.passed ? '#88c9f0' : '#d63333';
    ctx.strokeStyle = '#a02020';
    ctx.lineWidth = 2;
    ctx.fillRect(0, sy - 10, c.gapX1, 20);
    ctx.strokeRect(0, sy - 10, c.gapX1, 20);
    ctx.fillRect(c.gapX2, sy - 10, W - c.gapX2, 20);
    ctx.strokeRect(c.gapX2, sy - 10, W - c.gapX2, 20);
  });

  particles.forEach(p => {
    ctx.globalAlpha = p.life / 20;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#2a4fae';
  ctx.beginPath();
  ctx.arc(player.x, screenPlayerY, playerR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(player.x - 18, screenPlayerY - 18);
  ctx.lineTo(player.x - playerR, screenPlayerY - 4);
  ctx.moveTo(player.x + 18, screenPlayerY - 18);
  ctx.lineTo(player.x + playerR, screenPlayerY - 4);
  ctx.stroke();
}

function drawLanded() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#bfe9ff');
  grad.addColorStop(1, '#eaf7ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#5cb85c';
  ctx.beginPath();
  ctx.ellipse(W / 2, H / 2 + 60, 140, 60, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2a4fae';
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, playerR, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('You landed on the island!', W / 2, 80);
}

function drawDragon() {
  const x = dragon.x, y = dragon.y;
  const flash = dragon.hitFlash > 0;
  const bodyColor = flash ? '#fff' : '#3f6fd6';
  const wingColor = flash ? '#fff' : '#6a3fbf';
  const wingFlap = Math.sin(t * 0.12) * 8;

  ctx.fillStyle = wingColor;
  ctx.beginPath();
  ctx.moveTo(x - 8, y - 6);
  ctx.lineTo(x - 46, y - 34 - wingFlap);
  ctx.lineTo(x - 30, y - 16);
  ctx.lineTo(x - 40, y - 4 - wingFlap * 0.4);
  ctx.lineTo(x - 18, y + 2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#2a2070';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#2a4fae';
  ctx.beginPath();
  ctx.moveTo(x - 30, y + 8);
  ctx.quadraticCurveTo(x - 55, y + 6, x - 72, y + 18);
  ctx.quadraticCurveTo(x - 60, y + 12, x - 40, y + 14);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(x, y, 36, 15, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = bodyColor;
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 24, y - 2);
  ctx.quadraticCurveTo(x + 40, y - 16, x + 46, y - 24);
  ctx.stroke();

  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.arc(x + 48, y - 26, 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#2a4fae';
  ctx.beginPath();
  ctx.moveTo(x + 38, y - 36);
  ctx.lineTo(x + 42, y - 46);
  ctx.lineTo(x + 46, y - 37);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 48, y - 37);
  ctx.lineTo(x + 52, y - 47);
  ctx.lineTo(x + 55, y - 37);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#e0812a';
  ctx.beginPath();
  ctx.moveTo(x + 58, y - 22);
  ctx.lineTo(x + 80, y - 18);
  ctx.lineTo(x + 58, y - 14);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath();
  ctx.arc(x + 52, y - 29, 2.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#c9a0e0';
  for (let i = 0; i < 5; i++) {
    const sx = x + 20 - i * 12;
    const sy = y - 14 + i * 0.5;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - 4, sy - 8);
    ctx.lineTo(sx + 2, sy - 2);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#2a4fae';
  [-14, 10].forEach(dx => {
    ctx.fillRect(x + dx - 2, y + 10, 5, 10);
  });
}

function drawBoss() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#5ec6ff');
  grad.addColorStop(1, '#cdeeff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#c98a3c';
  ctx.fillRect(0, boss.groundY, W, H - boss.groundY);
  ctx.fillStyle = '#5cb85c';
  ctx.fillRect(0, boss.groundY, W, 8);

  drawDragon();

  fireballs.forEach(f => {
    ctx.fillStyle = '#ff6a1f';
    ctx.beginPath();
    ctx.arc(f.x, f.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  const p = boss.player;
  ctx.save();
  ctx.translate(p.x + 11, p.y + 14);
  ctx.scale(p.facing, 1);
  ctx.fillStyle = '#3fae4a';
  ctx.fillRect(-11, -8, 22, 22);
  ctx.fillStyle = '#ffd9a0';
  ctx.beginPath();
  ctx.arc(0, -12, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function draw() {
  if (phase === 'falling') drawFalling();
  else if (phase === 'landed') drawLanded();
  else if (phase === 'boss' || phase === 'win') drawBoss();

  if (phase === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DRAGON DEFEATED!', W / 2, H / 2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
