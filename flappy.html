<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: sans-serif;
    color: #eee;
  }
  h1 { margin: 8px 0; }
  #score { margin-bottom: 8px; font-size: 20px; }
  canvas {
    background: #4ec0ca;
    border: 2px solid #444;
  }
  #msg {
    margin-top: 10px;
    height: 24px;
    color: #f55;
    font-weight: bold;
  }
</style>
</head>
<body>
<h1>Flappy Bird</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="500"></canvas>
<div id="msg">Click or press Space to flap and start</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const gravity = 0.28;
const flapPower = -6;
const pipeGap = 180;
const pipeWidth = 60;
const pipeSpeed = 1.8;
const coinR = 10;

let bird, pipes, coins, score, running, started, loopId;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq, duration, type, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = volume || 0.15;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}

function playFlap() { beep(500, 0.08, 'square', 0.1); }
function playCoin() {
  beep(880, 0.1, 'sine', 0.15);
  setTimeout(() => beep(1320, 0.12, 'sine', 0.15), 60);
}
function playCrash() { beep(140, 0.4, 'sawtooth', 0.2); }

function reset() {
  bird = { x: 80, y: H / 2, vy: 0, r: 14 };
  pipes = [];
  coins = [];
  score = 0;
  running = true;
  started = false;
  document.getElementById('score').textContent = 'Score: 0';
  document.getElementById('msg').textContent = 'Click or press Space to flap and start';
}

function addPipe() {
  const topHeight = 40 + Math.random() * (H - pipeGap - 80);
  pipes.push({ x: W, top: topHeight, passed: false });
  coins.push({ x: W + pipeWidth / 2, y: topHeight + pipeGap / 2, collected: false });
}

function flap() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!running) {
    reset();
    return;
  }
  started = true;
  bird.vy = flapPower;
  playFlap();
}

function update() {
  if (!running || !started) return;

  bird.vy += gravity;
  bird.y += bird.vy;

  if (pipes.length === 0 || pipes[pipes.length - 1].x < W - 200) {
    addPipe();
  }

  pipes.forEach(p => p.x -= pipeSpeed);
  pipes = pipes.filter(p => p.x + pipeWidth > 0);
  coins.forEach(c => c.x -= pipeSpeed);
  coins = coins.filter(c => c.x > -20);

  pipes.forEach(p => {
    if (!p.passed && p.x + pipeWidth < bird.x) {
      p.passed = true;
      score++;
      document.getElementById('score').textContent = 'Score: ' + score;
    }
  });

  coins.forEach(c => {
    if (!c.collected) {
      const dx = bird.x - c.x, dy = bird.y - c.y;
      if (Math.sqrt(dx * dx + dy * dy) < bird.r + coinR) {
        c.collected = true;
        score += 5;
        document.getElementById('score').textContent = 'Score: ' + score;
        playCoin();
      }
    }
  });
  coins = coins.filter(c => !c.collected);

  if (bird.y + bird.r > H || bird.y - bird.r < 0) {
    gameOver();
  }

  pipes.forEach(p => {
    const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + pipeWidth;
    const inGapTop = bird.y - bird.r < p.top;
    const inGapBottom = bird.y + bird.r > p.top + pipeGap;
    if (inX && (inGapTop || inGapBottom)) {
      gameOver();
    }
  });
}

function gameOver() {
  if (running) playCrash();
  running = false;
  document.getElementById('msg').textContent = 'Game Over — Score: ' + score + ' — Click or Space to restart';
}

function draw() {
  ctx.fillStyle = '#4ec0ca';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#5cb85c';
  pipes.forEach(p => {
    ctx.fillRect(p.x, 0, pipeWidth, p.top);
    ctx.fillRect(p.x, p.top + pipeGap, pipeWidth, H - p.top - pipeGap);
    ctx.fillStyle = '#4a934a';
    ctx.fillRect(p.x - 3, p.top - 20, pipeWidth + 6, 20);
    ctx.fillRect(p.x - 3, p.top + pipeGap, pipeWidth + 6, 20);
    ctx.fillStyle = '#5cb85c';
  });

  ctx.fillStyle = '#ffd700';
  coins.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, coinR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#c9a400';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  ctx.fillStyle = '#f5d90a';
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(bird.x + 5, bird.y - 4, 2, 0, Math.PI * 2);
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('mousedown', flap);

reset();
draw();
loop();
</script>
</body>
</html>
