<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flower Dash</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: sans-serif;
    color: #eee;
  }
  h1 { margin: 8px 0; }
  #hud { margin-bottom: 8px; font-size: 20px; }
  canvas {
    border: 2px solid #444;
    border-radius: 6px;
    image-rendering: pixelated;
  }
  #msg { margin-top: 10px; font-size: 14px; color: #ccc; text-align: center; }
</style>
</head>
<body>
<h1>Flower Dash</h1>
<div id="hud">Time: 60 &nbsp;&nbsp; Score: 0</div>
<canvas id="game" width="600" height="450"></canvas>
<div id="msg">WASD/Arrows to walk. Pick as many flowers as you can before time runs out!</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, duration, type, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = volume || 0.15;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}
function playPick(pts) { beep(600 + pts * 6, 0.08, 'sine', 0.13); setTimeout(() => beep(900 + pts * 6, 0.09, 'sine', 0.13), 50); }
function playTick() { beep(500, 0.05, 'square', 0.1); }
function playEnd() {
  [660, 880, 990, 1320].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'sine', 0.15), i * 130));
}

const TYPES = [
  { name: 'daisy', pts: 10, weight: 5 },
  { name: 'poppy', pts: 10, weight: 5 },
  { name: 'sunflower', pts: 15, weight: 4 },
  { name: 'tulip', pts: 15, weight: 4 },
  { name: 'rose', pts: 20, weight: 3 },
  { name: 'golden', pts: 50, weight: 1 }
];
const WEIGHTED = TYPES.flatMap(t => Array(t.weight).fill(t));

function stem(x, y, h, s) {
  ctx.fillStyle = '#2d6b2d';
  ctx.fillRect(Math.round(x - 1.5 * s), Math.round(y - h * s), Math.round(3 * s), Math.round(h * s));
  ctx.strokeStyle = '#1a3d1a';
  ctx.lineWidth = 1;
  ctx.strokeRect(Math.round(x - 1.5 * s), Math.round(y - h * s), Math.round(3 * s), Math.round(h * s));
}

function px(cx, cy, size, color) {
  const half = size / 2;
  const rx = Math.round(cx - half), ry = Math.round(cy - half), rs = Math.round(size);
  ctx.fillStyle = color;
  ctx.fillRect(rx, ry, rs, rs);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1;
  ctx.strokeRect(rx, ry, rs, rs);
}

function drawDaisy(x, y, s) {
  stem(x, y + 12 * s, 16, s);
  const cy = y - 4 * s;
  for (let i = 0; i < 6; i++) {
    const ang = (i / 6) * Math.PI * 2;
    px(x + Math.cos(ang) * 7 * s, cy + Math.sin(ang) * 7 * s, 6 * s, i % 2 === 0 ? '#ffffff' : '#eef2ff');
  }
  px(x, cy, 7 * s, '#f2d80f');
}

function drawPoppy(x, y, s) {
  stem(x, y + 10 * s, 14, s);
  const cy = y - 6 * s;
  for (let i = 0; i < 5; i++) {
    const ang = (i / 5) * Math.PI * 2;
    px(x + Math.cos(ang) * 5.5 * s, cy + Math.sin(ang) * 5.5 * s, 6.5 * s, i % 2 === 0 ? '#e05a1f' : '#c8451a');
  }
  px(x, cy, 5 * s, '#2b1a0a');
}

function drawSunflower(x, y, s) {
  stem(x, y + 12 * s, 16, s);
  const cy = y - 4 * s;
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2;
    px(x + Math.cos(ang) * 8 * s, cy + Math.sin(ang) * 8 * s, 6 * s, i % 2 === 0 ? '#f2c40f' : '#d9a900');
  }
  px(x, cy, 8 * s, '#6b4522');
}

function drawTulip(x, y, s, color) {
  stem(x, y + 10 * s, 14, s);
  const cy = y - 4 * s;
  px(x, cy - 8 * s, 7 * s, color);
  px(x - 5 * s, cy - 3 * s, 6 * s, color);
  px(x + 5 * s, cy - 3 * s, 6 * s, color);
}

function drawRose(x, y, s) {
  stem(x, y + 12 * s, 16, s);
  px(x, y, 15 * s, '#3d8b3d');
  for (let i = 0; i < 5; i++) {
    const ang = (i / 5) * Math.PI * 2;
    px(x + Math.cos(ang) * 5 * s, y + Math.sin(ang) * 5 * s, 5.5 * s, i % 2 === 0 ? '#d63333' : '#b82a2a');
  }
}

function drawGolden(x, y, s, t) {
  const cy = y - 4 * s;
  const glow = 0.5 + 0.4 * Math.sin(t * 0.15);
  ctx.save();
  ctx.globalAlpha = glow;
  px(x, cy, 28 * s, '#fff7c0');
  ctx.restore();
  stem(x, y + 12 * s, 16, s);
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2;
    px(x + Math.cos(ang) * 8 * s, cy + Math.sin(ang) * 8 * s, 6 * s, i % 2 === 0 ? '#ffd700' : '#e0b800');
  }
  px(x, cy, 8 * s, '#e0812a');
}

const TULIP_COLORS = ['#d63333', '#f2c40f', '#e79fc4', '#fff'];

function drawFlower(f, tGlobal) {
  const bob = Math.sin(tGlobal * 0.06 + f.seed) * 2;
  const x = f.x, y = f.y + bob;
  const s = 1;
  switch (f.type.name) {
    case 'daisy': drawDaisy(x, y, s); break;
    case 'poppy': drawPoppy(x, y, s); break;
    case 'sunflower': drawSunflower(x, y, s); break;
    case 'tulip': drawTulip(x, y, s, f.color); break;
    case 'rose': drawRose(x, y, s); break;
    case 'golden': drawGolden(x, y, s, tGlobal); break;
  }
}

function randomFlower() {
  const type = WEIGHTED[Math.floor(Math.random() * WEIGHTED.length)];
  return {
    type,
    x: 40 + Math.random() * (W - 80),
    y: 60 + Math.random() * (H - 100),
    color: TULIP_COLORS[Math.floor(Math.random() * TULIP_COLORS.length)],
    seed: Math.random() * 10
  };
}

let flowers = [];
for (let i = 0; i < 7; i++) flowers.push(randomFlower());

let player = { x: W / 2, y: H / 2, size: 15 };
let keys = {};
let score = 0, picked = 0, timeLeft = 60, t = 0, state = 'playing';
let popups = [];
let lastTickSecond = 60;

document.addEventListener('keydown', e => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  keys[e.code] = true;
  if ((e.code === 'Space') && state === 'over') resetGame();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function resetGame() {
  flowers = [];
  for (let i = 0; i < 7; i++) flowers.push(randomFlower());
  player.x = W / 2; player.y = H / 2;
  score = 0; picked = 0; timeLeft = 60; state = 'playing';
  lastTickSecond = 60;
  popups = [];
  document.getElementById('hud').textContent = 'Time: 60    Score: 0';
  document.getElementById('msg').textContent = 'WASD/Arrows to walk. Pick as many flowers as you can before time runs out!';
}

let frameAccum = 0;
function update() {
  t++;

  if (state !== 'playing') return;

  let vx = 0, vy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) vx -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) vx += 1;
  if (keys['ArrowUp'] || keys['KeyW']) vy -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) vy += 1;
  const len = Math.hypot(vx, vy) || 1;
  player.x += (vx / len) * 3.2;
  player.y += (vy / len) * 3.2;
  player.x = Math.max(player.size, Math.min(W - player.size, player.x));
  player.y = Math.max(player.size, Math.min(H - player.size, player.y));

  flowers.forEach(f => {
    const dist = Math.hypot(player.x - f.x, player.y - f.y);
    if (dist < player.size + 14) {
      score += f.type.pts;
      picked++;
      playPick(f.type.pts);
      popups.push({ x: f.x, y: f.y - 15, text: '+' + f.type.pts, life: 35, golden: f.type.name === 'golden' });
      const idx = flowers.indexOf(f);
      flowers[idx] = randomFlower();
      document.getElementById('hud').textContent = 'Time: ' + Math.ceil(timeLeft) + '    Score: ' + score;
    }
  });

  popups.forEach(p => { p.y -= 0.7; p.life--; });
  popups = popups.filter(p => p.life > 0);

  timeLeft -= 1 / 60;
  if (timeLeft <= 0) {
    timeLeft = 0;
    state = 'over';
    playEnd();
    document.getElementById('msg').textContent = 'Time\'s up! Picked ' + picked + ' flowers, Score: ' + score + ' — Press Space to play again';
  } else {
    const secLeft = Math.ceil(timeLeft);
    if (secLeft <= 10 && secLeft !== lastTickSecond) {
      lastTickSecond = secLeft;
      playTick();
    }
    document.getElementById('hud').textContent = 'Time: ' + secLeft + '    Score: ' + score;
  }
}

function drawPlayer() {
  const x = Math.round(player.x), y = Math.round(player.y);
  const walk = (keys['ArrowLeft'] || keys['KeyA'] || keys['ArrowRight'] || keys['KeyD'] || keys['ArrowUp'] || keys['KeyW'] || keys['ArrowDown'] || keys['KeyS'])
    ? Math.floor(t / 8) % 2 : 0;

  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(x - 6, y + 12, 5, 6 + walk * 2);
  ctx.fillRect(x + 1, y + 12, 5, 8 - walk * 2);

  ctx.fillStyle = '#3b6bd6';
  ctx.fillRect(x - 9, y - 6, 18, 20);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - 9, y - 6, 18, 20);

  ctx.fillStyle = '#ffd9a0';
  ctx.fillRect(x - 8, y - 22, 16, 16);
  ctx.strokeRect(x - 8, y - 22, 16, 16);

  ctx.fillStyle = '#6b4522';
  ctx.fillRect(x - 9, y - 26, 18, 7);
  ctx.strokeRect(x - 9, y - 26, 18, 7);

  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(x - 5, y - 15, 3, 3);
  ctx.fillRect(x + 2, y - 15, 3, 3);
}

const TILE = 25;
const tufts = [];
for (let i = 0; i < 40; i++) {
  tufts.push({ x: Math.floor(Math.random() * (W / TILE)) * TILE + TILE / 2, y: Math.floor(Math.random() * (H / TILE)) * TILE + TILE / 2 });
}

function drawBackground() {
  for (let row = 0; row < H / TILE; row++) {
    for (let col = 0; col < W / TILE; col++) {
      ctx.fillStyle = (row + col) % 2 === 0 ? '#7fc76b' : '#74bd60';
      ctx.fillRect(col * TILE, row * TILE, TILE, TILE);
    }
  }
  ctx.fillStyle = '#5aa346';
  tufts.forEach(tu => {
    ctx.fillRect(tu.x - 2, tu.y - 3, 2, 5);
    ctx.fillRect(tu.x + 2, tu.y - 3, 2, 5);
    ctx.fillRect(tu.x, tu.y - 5, 2, 6);
  });
}

function draw() {
  drawBackground();

  flowers.forEach(f => drawFlower(f, t));
  drawPlayer();

  popups.forEach(p => {
    ctx.globalAlpha = p.life / 35;
    ctx.fillStyle = p.golden ? '#ffd700' : '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
  });
  ctx.globalAlpha = 1;

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Time\'s Up!', W / 2, H / 2 - 20);
    ctx.font = '20px sans-serif';
    ctx.fillText('Score: ' + score + '  (' + picked + ' flowers)', W / 2, H / 2 + 16);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
