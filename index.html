<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: sans-serif;
    color: #eee;
  }
  h1 { margin: 8px 0; }
  #score { margin-bottom: 8px; font-size: 20px; }
  canvas {
    background: #000;
    border: 2px solid #444;
  }
  #msg {
    margin-top: 10px;
    height: 24px;
    color: #f55;
    font-weight: bold;
  }
</style>
</head>
<body>
<h1>Snake</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="msg"></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const box = 20;
const cols = canvas.width / box;
const rows = canvas.height / box;

let snake, dir, food, score, running, loopId;

function rand(max) { return Math.floor(Math.random() * max); }

function placeFood() {
  let pos;
  do {
    pos = { x: rand(cols), y: rand(rows) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  return pos;
}

function reset() {
  snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
  dir = { x: 1, y: 0 };
  score = 0;
  food = placeFood();
  running = true;
  document.getElementById('msg').textContent = '';
  document.getElementById('score').textContent = 'Score: 0';
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#f33';
  ctx.fillRect(food.x * box, food.y * box, box, box);

  ctx.fillStyle = '#3f3';
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#5f5' : '#3a3';
    ctx.fillRect(s.x * box, s.y * box, box - 1, box - 1);
  });
}

function step() {
  if (!running) return;

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (
    head.x < 0 || head.x >= cols ||
    head.y < 0 || head.y >= rows ||
    snake.some(s => s.x === head.x && s.y === head.y)
  ) {
    running = false;
    document.getElementById('msg').textContent = 'Game Over — press Space to restart';
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = 'Score: ' + score;
    food = placeFood();
  } else {
    snake.pop();
  }

  draw();
}

document.addEventListener('keydown', e => {
  const key = e.key;
  if (key === ' ' && !running) {
    reset();
    return;
  }
  if (key === 'ArrowUp' && dir.y === 0) dir = { x: 0, y: -1 };
  else if (key === 'ArrowDown' && dir.y === 0) dir = { x: 0, y: 1 };
  else if (key === 'ArrowLeft' && dir.x === 0) dir = { x: -1, y: 0 };
  else if (key === 'ArrowRight' && dir.x === 0) dir = { x: 1, y: 0 };
});

reset();
draw();
setInterval(step, 120);
</script>
</body>
</html>
