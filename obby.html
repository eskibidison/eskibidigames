<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Obby</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: sans-serif;
    color: #eee;
  }
  h1 { margin: 8px 0; }
  #hud { margin-bottom: 8px; font-size: 20px; }
  canvas {
    border: 2px solid #444;
    border-radius: 6px;
  }
  #msg {
    margin-top: 10px;
    height: 24px;
    color: #f55;
    font-weight: bold;
  }
</style>
</head>
<body>
<h1>Obby</h1>
<div id="hud">Stage: 0 / 20 &nbsp;&nbsp; Falls: 0</div>
<canvas id="game" width="600" height="400"></canvas>
<div id="msg">Arrows/AD to move, Space/Up to jump. Reach the flag!</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const gravity = 0.42;
const jumpPower = -10.5;
const moveSpeed = 3.7;
const playerSize = 22;
const coyoteTime = 120;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, duration, type, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = volume || 0.15;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}
function playJump() { beep(500, 0.08, 'square', 0.08); }
function playFall() { beep(160, 0.25, 'sawtooth', 0.15); }
function playCheckpoint() { beep(700, 0.08, 'sine', 0.12); setTimeout(() => beep(1000, 0.1, 'sine', 0.12), 70); }
function playWin() { beep(660, 0.15, 'sine', 0.15); setTimeout(() => beep(880, 0.15, 'sine', 0.15), 130); setTimeout(() => beep(1100, 0.2, 'sine', 0.15), 260); }

const numPlatforms = 20;
let platforms = [];
let px = 60, py = 320;
for (let i = 0; i < numPlatforms; i++) {
  const w = 85 + (i % 3) * 15;
  const moving = i > 3 && i % 4 === 0;
  platforms.push({
    x: px, y: py, w, h: 16,
    moving,
    baseY: py,
    amplitude: 22,
    speed: 0.9 + (i % 3) * 0.15,
    angle: i * 1.3,
    prevY: py
  });
  px += w + 48 + (i % 5) * 10;
  py = 240 + Math.sin(i * 0.7) * 60;
}
const goal = { x: px + 30, y: py - 50, w: 24, h: 50 };

let player, falls, stage, checkpointIndex, running, keys, lastGroundTime, particles, t;

function reset() {
  checkpointIndex = 0;
  spawnAt(0);
  falls = 0;
  stage = 0;
  running = true;
  particles = [];
  t = 0;
  document.getElementById('hud').textContent = 'Stage: 0 / ' + numPlatforms + '    Falls: 0';
  document.getElementById('msg').textContent = 'Arrows/AD to move, Space/Up to jump. Reach the flag!';
}

function spawnAt(idx) {
  const p = platforms[idx];
  player = { x: p.x + 10, y: p.y - playerSize, vx: 0, vy: 0, onGround: true, standingOn: idx, squash: 1 };
  lastGroundTime = 0;
}

function burst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const ang = (Math.PI * 2 * i) / 10;
    particles.push({ x, y, vx: Math.cos(ang) * 2.5, vy: Math.sin(ang) * 2.5, life: 30, color });
  }
}

keys = { left: false, right: false, jump: false };
document.addEventListener('keydown', e => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
    e.preventDefault();
    keys.jump = true;
    if (!running) reset();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.jump = false;
});

function update() {
  t++;

  platforms.forEach(p => {
    if (p.moving) {
      p.prevY = p.y;
      p.angle += p.speed * 0.03;
      p.y = p.baseY + Math.sin(p.angle) * p.amplitude;
    }
  });

  particles.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.life--; });
  particles = particles.filter(pt => pt.life > 0);

  if (!running) return;

  if (keys.left) player.vx = -moveSpeed;
  else if (keys.right) player.vx = moveSpeed;
  else player.vx = 0;

  const canCoyoteJump = player.onGround || (t - lastGroundTime) * 16.6 < coyoteTime;
  if (keys.jump && canCoyoteJump) {
    player.vy = jumpPower;
    player.onGround = false;
    player.standingOn = null;
    player.squash = 1.3;
    playJump();
  }

  const prevBottom = player.y + playerSize;
  player.vy += gravity;
  player.x += player.vx;
  player.y += player.vy;

  let landed = false;

  if (player.onGround && player.standingOn !== null) {
    const p = platforms[player.standingOn];
    const withinX = player.x + playerSize > p.x && player.x < p.x + p.w;
    if (withinX) {
      player.y = p.y - playerSize;
      player.vy = 0;
      landed = true;
    }
  }

  if (!landed) {
    platforms.forEach((p, i) => {
      const withinX = player.x + playerSize > p.x && player.x < p.x + p.w;
      const newBottom = player.y + playerSize;
      if (withinX && prevBottom <= p.y + 2 && newBottom >= p.y && player.vy >= 0) {
        player.y = p.y - playerSize;
        player.vy = 0;
        landed = true;
        if (!player.onGround) player.squash = 0.7;
        player.standingOn = i;
        if (i > checkpointIndex) {
          checkpointIndex = i;
          stage = i + 1;
          document.getElementById('hud').textContent = 'Stage: ' + stage + ' / ' + numPlatforms + '    Falls: ' + falls;
          playCheckpoint();
          burst(player.x + playerSize / 2, player.y + playerSize, '#ffd700');
        }
      }
    });
  }

  player.onGround = landed;
  if (landed) lastGroundTime = t;

  player.squash += (1 - player.squash) * 0.2;

  if (
    player.x + playerSize > goal.x && player.x < goal.x + goal.w &&
    player.y + playerSize > goal.y && player.y < goal.y + goal.h
  ) {
    running = false;
    document.getElementById('msg').textContent = 'You finished the Obby! Falls: ' + falls + ' — Space to restart';
    playWin();
    burst(goal.x, goal.y + 20, '#ff5555');
  }

  if (player.y > H + 100) {
    falls++;
    document.getElementById('hud').textContent = 'Stage: ' + stage + ' / ' + numPlatforms + '    Falls: ' + falls;
    playFall();
    spawnAt(checkpointIndex);
  }
}

function draw() {
  const camX = Math.max(0, player.x - 150);

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#7fd6ff');
  grad.addColorStop(1, '#bdf0ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 5; i++) {
    const cx = ((i * 220 - t * 0.3) % (W + 200)) - camX * 0.3;
    ctx.beginPath();
    ctx.ellipse(cx % (W + 200), 60 + (i % 3) * 40, 30, 14, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  platforms.forEach((p, i) => {
    const sx = p.x - camX;
    if (sx < -150 || sx > W + 50) return;
    ctx.fillStyle = i <= checkpointIndex ? '#8b5a2b' : '#6b4522';
    ctx.fillRect(sx, p.y + 6, p.w, p.h - 6);
    ctx.fillStyle = i <= checkpointIndex ? '#5cd85c' : '#3d8b3d';
    ctx.fillRect(sx, p.y, p.w, 8);
  });

  const flagWave = Math.sin(t * 0.1) * 4;
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(goal.x - camX, goal.y + goal.h);
  ctx.lineTo(goal.x - camX, goal.y);
  ctx.stroke();
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(goal.x - camX, goal.y);
  ctx.lineTo(goal.x - camX + 22, goal.y + 8 + flagWave);
  ctx.lineTo(goal.x - camX, goal.y + 18);
  ctx.closePath();
  ctx.fill();

  particles.forEach(pt => {
    ctx.globalAlpha = pt.life / 30;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x - camX, pt.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  const sqx = playerSize * (1 / player.squash) * 0.3 + playerSize * 0.7;
  const sqy = playerSize * player.squash * 0.3 + playerSize * 0.7;
  ctx.fillStyle = '#f5d90a';
  ctx.beginPath();
  ctx.ellipse(player.x - camX + playerSize / 2, player.y + playerSize - sqy / 2, sqx / 2, sqy / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(player.x - camX + playerSize / 2 + 4, player.y + playerSize - sqy / 2 - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
draw();
loop();
</script>
</body>
</html>
