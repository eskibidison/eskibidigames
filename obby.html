<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Obby</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: sans-serif;
    color: #eee;
  }
  h1 { margin: 8px 0; }
  #hud { margin-bottom: 8px; font-size: 20px; }
  canvas {
    background: #87ceeb;
    border: 2px solid #444;
  }
  #msg {
    margin-top: 10px;
    height: 24px;
    color: #f55;
    font-weight: bold;
  }
</style>
</head>
<body>
<h1>Obby</h1>
<div id="hud">Stage: 0 / 20 &nbsp;&nbsp; Falls: 0</div>
<canvas id="game" width="600" height="400"></canvas>
<div id="msg">Arrows/AD to move, Space/Up to jump. Reach the flag!</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const gravity = 0.6;
const jumpPower = -11;
const moveSpeed = 3.5;
const playerSize = 22;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, duration, type, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = volume || 0.15;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}
function playJump() { beep(500, 0.08, 'square', 0.08); }
function playFall() { beep(160, 0.25, 'sawtooth', 0.15); }
function playCheckpoint() { beep(700, 0.08, 'sine', 0.12); setTimeout(() => beep(1000, 0.1, 'sine', 0.12), 70); }
function playWin() { beep(660, 0.15, 'sine', 0.15); setTimeout(() => beep(880, 0.15, 'sine', 0.15), 130); setTimeout(() => beep(1100, 0.2, 'sine', 0.15), 260); }

const numPlatforms = 20;
let platforms = [];
let x = 60, y = 320;
for (let i = 0; i < numPlatforms; i++) {
  const w = 70 + (i % 3) * 15;
  const moving = i > 3 && i % 4 === 0;
  platforms.push({
    x, y, w, h: 16,
    moving,
    baseY: y,
    range: 60,
    speed: 1.2 + (i % 3) * 0.3,
    phase: i
  });
  x += w + 70 + (i % 5) * 15;
  y = 240 + Math.sin(i * 0.7) * 90;
}
const goal = { x: x + 30, y: y - 50, w: 24, h: 50 };
const worldEnd = goal.x + 100;

let player, falls, stage, checkpointIndex, running, keys;

function reset() {
  checkpointIndex = 0;
  spawnAt(0);
  falls = 0;
  stage = 0;
  running = true;
  document.getElementById('hud').textContent = 'Stage: 0 / ' + numPlatforms + '    Falls: 0';
  document.getElementById('msg').textContent = 'Arrows/AD to move, Space/Up to jump. Reach the flag!';
}

function spawnAt(idx) {
  const p = platforms[idx];
  player = { x: p.x + 10, y: p.y - playerSize, vx: 0, vy: 0, onGround: false };
}

keys = { left: false, right: false, jump: false };
document.addEventListener('keydown', e => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
    e.preventDefault();
    keys.jump = true;
    if (!running) reset();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.jump = false;
});

function update() {
  platforms.forEach(p => {
    if (p.moving) p.y = p.baseY + Math.sin((Date.now() / 500) + p.phase) * p.range * 0.01 * 60 * 0.5;
  });

  if (!running) return;

  if (keys.left) player.vx = -moveSpeed;
  else if (keys.right) player.vx = moveSpeed;
  else player.vx = 0;

  if (keys.jump && player.onGround) {
    player.vy = jumpPower;
    player.onGround = false;
    playJump();
  }

  player.vy += gravity;
  player.x += player.vx;
  player.y += player.vy;
  player.onGround = false;

  platforms.forEach((p, i) => {
    const withinX = player.x + playerSize > p.x && player.x < p.x + p.w;
    const wasAbove = player.y + playerSize - player.vy <= p.y;
    const nowBelowTop = player.y + playerSize >= p.y;
    if (withinX && wasAbove && nowBelowTop && player.vy >= 0) {
      player.y = p.y - playerSize;
      player.vy = 0;
      player.onGround = true;
      if (i > checkpointIndex) {
        checkpointIndex = i;
        stage = i + 1;
        document.getElementById('hud').textContent = 'Stage: ' + stage + ' / ' + numPlatforms + '    Falls: ' + falls;
        playCheckpoint();
      }
    }
  });

  if (
    player.x + playerSize > goal.x && player.x < goal.x + goal.w &&
    player.y + playerSize > goal.y && player.y < goal.y + goal.h
  ) {
    running = false;
    document.getElementById('msg').textContent = 'You finished the Obby! Falls: ' + falls + ' — Space to restart';
    playWin();
  }

  if (player.y > H + 100) {
    falls++;
    document.getElementById('hud').textContent = 'Stage: ' + stage + ' / ' + numPlatforms + '    Falls: ' + falls;
    playFall();
    spawnAt(checkpointIndex);
  }
}

function draw() {
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(0, 0, W, H);

  const camX = Math.max(0, player.x - 150);

  ctx.fillStyle = '#5cb85c';
  platforms.forEach((p, i) => {
    ctx.fillStyle = i <= checkpointIndex ? '#5cb85c' : '#3d8b3d';
    ctx.fillRect(p.x - camX, p.y, p.w, p.h);
  });

  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(goal.x - camX, goal.y, 4, goal.h);
  ctx.beginPath();
  ctx.moveTo(goal.x - camX + 4, goal.y);
  ctx.lineTo(goal.x - camX + 24, goal.y + 10);
  ctx.lineTo(goal.x - camX + 4, goal.y + 20);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#f5d90a';
  ctx.fillRect(player.x - camX, player.y, playerSize, playerSize);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
draw();
loop();
</script>
</body>
</html>
