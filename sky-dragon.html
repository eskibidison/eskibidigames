const W = 240, H = 160;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- scale to fit window, integer factors only ---------- */
const stage = document.getElementById('stage');
function fit(){
  const s = Math.max(1, Math.min(Math.floor(innerWidth/W), Math.floor((innerHeight-20)/H)));
  stage.style.width = (W*s)+'px'; stage.style.height = (H*s)+'px';
  cv.style.width = (W*s)+'px';    cv.style.height = (H*s)+'px';
}
addEventListener('resize', fit); fit();

/* =========================== assets =========================== */
const IMG = {};
let pending = 0;
for (const k in ASSETS){
  pending++;
  const im = new Image();
  im.onload = () => { if(--pending === 0) boot(); };
  im.onerror = () => { if(--pending === 0) boot(); };
  im.src = ASSETS[k];
  IMG[k] = im;
}

/* =========================== helpers =========================== */
const TAU = Math.PI*2;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;
const rnd   = (a,b) => a+Math.random()*(b-a);
const dist  = (x1,y1,x2,y2) => Math.hypot(x2-x1,y2-y1);

/* recolour an image, keeping its alpha (used for flashes + font) */
const tintCache = new Map();
function tint(img, col){
  const key = img.src.slice(-24)+col;
  let c = tintCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(img,0,0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = col; g.fillRect(0,0,c.width,c.height);
  tintCache.set(key,c);
  return c;
}

/* ---------- bitmap font (ASCII from 32, 15 glyphs per row, 8x8) ---------- */
const GW = 8, ADV = 7;
function text(s, x, y, col){
  const f = tint(IMG.font, col || '#f4f6ff');
  s = String(s);
  for (let i=0;i<s.length;i++){
    const c = s.charCodeAt(i)-32;
    if (c < 0) continue;
    ctx.drawImage(f, (c%15)*GW, (c/15|0)*GW, GW, GW, Math.round(x+i*ADV), Math.round(y), GW, GW);
  }
}
const textW = s => String(s).length*ADV;
function textC(s, y, col){ text(s, Math.round((W-textW(s))/2), y, col); }
/* text with a hard 1px shadow — reads on any background */
function textS(s, x, y, col, sh){
  text(s, x+1, y+1, sh || '#101422');
  text(s, x, y, col);
}
function textCS(s, y, col, sh){ textS(s, Math.round((W-textW(s))/2), y, col, sh); }

/* ---------- sprite blit ---------- */
function blit(img, sx, sy, sw, sh, dx, dy, flip, flash){
  const src = flash ? tint(img, flash) : img;
  dx = Math.round(dx); dy = Math.round(dy);
  if (flip){
    ctx.save(); ctx.translate(dx+sw, dy); ctx.scale(-1,1);
    ctx.drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
    ctx.restore();
  } else {
    ctx.drawImage(src, sx, sy, sw, sh, dx, dy, sw, sh);
  }
}
/* rotated blit, anchored at centre */
function blitRot(img, sx, sy, sw, sh, cx, cy, ang, scaleX, scaleY, flash){
  const src = flash ? tint(img, flash) : img;
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.rotate(ang);
  ctx.scale(scaleX===undefined?1:scaleX, scaleY===undefined?1:scaleY);
  ctx.drawImage(src, sx, sy, sw, sh, -sw/2, -sh/2, sw, sh);
  ctx.restore();
}

/* =========================== audio =========================== */
/* A small chiptune/EDM engine: detuned saw lead, filtered saw bass with a
   sine sub, square arps, a drum machine, a tempo-locked delay send, and
   kick-triggered sidechain ducking across the whole music bus. */
const NOTE = { c:0, cs:1, d:2, ds:3, e:4, f:5, fs:6, g:7, gs:8, a:9, as:10, b:11 };
function n2m(s){
  const m = /^([a-g]s?)(-?\d+)$/.exec(s);
  return m ? NOTE[m[1]] + (parseInt(m[2],10)+1)*12 : null;
}
const P = str => str.trim().split(/\s+/).map(t => t === '.' ? null : n2m(t));
const D = str => str.trim().split(/\s+/);

const Snd = {
  ctx:null, muted:false, songName:null, song:null, step:0, nextT:0, timer:null,

  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();

    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -15; this.comp.ratio.value = 6;
    this.comp.attack.value = 0.004; this.comp.release.value = 0.18;
    this.master = c.createGain(); this.master.gain.value = 0.34;
    this.comp.connect(this.master); this.master.connect(c.destination);

    this.sfxGain = c.createGain(); this.sfxGain.gain.value = 1;
    this.sfxGain.connect(this.comp);

    /* music bus -> sidechain duck -> level -> compressor */
    this.musicBus = c.createGain(); this.musicBus.gain.value = 1;
    this.duck     = c.createGain(); this.duck.gain.value = 1;
    this.musicVol = c.createGain(); this.musicVol.gain.value = 0.52;
    this.musicBus.connect(this.duck);
    this.duck.connect(this.musicVol);
    this.musicVol.connect(this.comp);

    /* feedback delay, fed by the lead and arp only */
    this.delay = c.createDelay(1.5);
    this.delay.delayTime.value = 0.26;
    this.fb  = c.createGain(); this.fb.gain.value = 0.33;
    this.wet = c.createGain(); this.wet.gain.value = 0.34;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 520;
    this.delay.connect(this.fb); this.fb.connect(this.delay);
    this.delay.connect(hp); hp.connect(this.wet); this.wet.connect(this.musicBus);
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggle(){
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.34;
  },
  now(){ return this.ctx ? this.ctx.currentTime : 0; },
  midi(n){ return 440*Math.pow(2,(n-69)/12); },

  /* ---------- generic voices, also used by the sfx ---------- */
  tone(freq, t, dur, type, vol, dest){
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(t); o.stop(t+dur+0.02);
  },
  slide(f1, f2, t, dur, type, vol){
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(t, dur, vol, hp, dest){
    if (!this.ctx) return;
    const n = Math.max(1, Math.floor(this.ctx.sampleRate*dur));
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1-i/n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 800;
    const g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(dest || this.sfxGain);
    s.start(t);
  },

  /* ---------- musical voices ---------- */
  lead(f, t, dur, vol){
    const c = this.ctx; if (!c) return;
    const flt = c.createBiquadFilter();
    flt.type = 'lowpass'; flt.Q.value = 7;
    flt.frequency.setValueAtTime(700, t);
    flt.frequency.exponentialRampToValueAtTime(4600, t+0.05);
    flt.frequency.exponentialRampToValueAtTime(1100, t+dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    for (const det of [-9, 9]){
      const o = c.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
      o.connect(flt); o.start(t); o.stop(t+dur+0.03);
    }
    const sq = c.createOscillator(); sq.type = 'square'; sq.frequency.value = f*2;
    const sg = c.createGain(); sg.gain.value = 0.22;
    sq.connect(sg); sg.connect(flt); sq.start(t); sq.stop(t+dur+0.03);
    flt.connect(g); g.connect(this.musicBus); g.connect(this.delay);
  },
  bassV(f, t, dur, vol){
    const c = this.ctx; if (!c) return;
    const flt = c.createBiquadFilter();
    flt.type = 'lowpass'; flt.Q.value = 9;
    flt.frequency.setValueAtTime(2400, t);
    flt.frequency.exponentialRampToValueAtTime(240, t+Math.min(dur, 0.20));
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const sub = c.createOscillator(); sub.type = 'sine'; sub.frequency.value = f/2;
    const sg = c.createGain(); sg.gain.value = 0.85;
    o.connect(flt); sub.connect(sg); sg.connect(flt);
    flt.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t+dur+0.02); sub.start(t); sub.stop(t+dur+0.02);
  },
  pluck(f, t, dur, vol){
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(); o.type = 'square'; o.frequency.value = f;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.musicBus); g.connect(this.delay);
    o.start(t); o.stop(t+dur+0.02);
  },

  /* ---------- drums ---------- */
  duckAt(t){
    if (!this.duck) return;
    const d = this.duck.gain;
    d.cancelScheduledValues(t);
    d.setValueAtTime(0.44, t);
    d.linearRampToValueAtTime(1, t+0.17);
  },
  kick(t){
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(44, t+0.11);
    const g = c.createGain();
    g.gain.setValueAtTime(0.95, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.21);
    o.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t+0.23);
    this.noise(t, 0.012, 0.20, 2000, this.musicBus);
    this.duckAt(t);
  },
  snare(t){
    const c = this.ctx; if (!c) return;
    this.noise(t, 0.17, 0.42, 1500, this.musicBus);
    const o = c.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(230, t);
    o.frequency.exponentialRampToValueAtTime(150, t+0.1);
    const g = c.createGain();
    g.gain.setValueAtTime(0.32, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.13);
    o.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t+0.15);
  },
  hat(t, open){ this.noise(t, open?0.17:0.032, open?0.13:0.12, 7500, this.musicBus); },

  /* ---------- sfx ---------- */
  sfxPass(){ const t=this.now(); this.tone(880,t,.07,'square',.16); this.tone(1320,t+.05,.09,'square',.13); },
  sfxClang(){ const t=this.now(); this.noise(t,.14,.22,1800); this.tone(180,t,.12,'square',.14); },
  sfxCup(){ const t=this.now(); [1046,1318,1568].forEach((f,i)=>this.tone(f,t+i*.045,.10,'square',.14)); },
  sfxStar(){ const t=this.now(); this.noise(t,.05,.10,3000); this.slide(1200,600,t,.10,'square',.09); },
  sfxSlash(){ const t=this.now(); this.noise(t,.09,.16,2400); this.slide(720,300,t,.09,'sawtooth',.10); },
  sfxHitBoss(){ const t=this.now(); this.tone(300,t,.09,'square',.20); this.tone(180,t+.05,.14,'square',.16); this.noise(t,.10,.14,900); },
  sfxHurt(){ const t=this.now(); this.slide(420,110,t,.28,'sawtooth',.20); this.noise(t,.12,.12,500); },
  sfxHeart(){ const t=this.now(); [784,1046,1318].forEach((f,i)=>this.tone(f,t+i*.06,.12,'triangle',.16)); },
  sfxRoar(){ const t=this.now(); this.slide(220,60,t,.55,'sawtooth',.24); this.slide(150,48,t+.05,.55,'square',.14); this.noise(t,.5,.10,200); },
  sfxLand(){ const t=this.now(); this.noise(t,.22,.24,300); this.slide(200,70,t,.22,'square',.16); },
  sfxWin(){ const t=this.now(); [523,659,784,1046,1318,1568].forEach((f,i)=>this.tone(f,t+i*.11,.30,'square',.16)); },
  sfxDead(){ const t=this.now(); [440,392,330,262,196].forEach((f,i)=>this.tone(f,t+i*.15,.30,'square',.16)); },
  sfxSelect(){ const t=this.now(); this.tone(660,t,.06,'square',.16); this.tone(990,t+.06,.10,'square',.14); },

  /* ---------- sequencer ---------- */
  play(name){
    this.init(); this.resume();
    if (!this.ctx || this.songName === name) return;
    this.songName = name;
    this.song = SONGS[name];
    this.step = 0;
    this.nextT = this.ctx.currentTime + 0.08;
    /* a dotted-eighth echo locks the delay to the tempo */
    this.delay.delayTime.value = (60/this.song.bpm)*0.75;
    if (!this.timer) this.timer = setInterval(() => this.pump(), 25);
  },
  stop(){ this.songName = null; this.song = null; },
  pump(){
    if (!this.ctx || !this.song) return;
    const s = this.song, sp = 60/s.bpm/4;
    while (this.nextT < this.ctx.currentTime + 0.15){
      const i = this.step % s.len, t = this.nextT;
      const L = s.lead[i], B = s.bass[i], A = s.arp[i], dr = s.drum[i] || '.';
      if (L != null) this.lead(this.midi(L),  t, sp*1.9,  0.20);
      if (B != null) this.bassV(this.midi(B), t, sp*1.7,  0.34);
      if (A != null) this.pluck(this.midi(A), t, sp*0.75, 0.075);
      if (dr.indexOf('K') >= 0) this.kick(t);
      if (dr.indexOf('S') >= 0) this.snare(t);
      if (dr.indexOf('H') >= 0) this.hat(t, true);
      else if (dr.indexOf('h') >= 0) this.hat(t, false);
      this.nextT += sp; this.step++;
    }
  }
};

/* ---------------------------------------------------------------------------
   Songs — 16 steps to a bar, four bars to a pattern.
   Edit these freely: '.' is a rest, notes look like a3 / cs4 / g5.
   Drums: K kick, S snare, h hat, H open hat. Combine them, e.g. "KS".
   --------------------------------------------------------------------------- */
const SONGS = {

    bass: P('a1 .  .  .  .  .  a1 .  a1 .  .  .  .  .  .  . \

  sky: { bpm:158, len:64,

    bass: P('c2 .  c3 .  c2 .  c2 c3 .  c2 .  c3 c2 .  c3 . \

             a1 .  a2 .  a1 .  a1 a2 .  a1 .  a2 a1 .  a2 . \

    drum: D('K  h  h  h  KS h  h  h  K  h  h  h  KS h  h  h \

             K  h  h  h  KS h  h  h  K  h  K  h  KS S  S  H ') },

  /* the serpent — A minor, driving, nasty */
  boss: { bpm:172, len:64,
    lead: P('a4 .  .   c5   .  e5  .  .   d5 .   c5 .   a4 .   c5 . \

             e3 gs3 b3 gs3 e3 gs3 b3 gs3 e3 gs3 b3 gs3 e3 gs3 b3 gs3'),
    bass: P('a1 .  a2 .  a1 .  a1 a2 .  a1 .  a2 a1 .  a2 . \

/* =========================== input =========================== */
const keys = {};
const pressed = {};
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  KeyZ:'atk', KeyJ:'atk', Space:'star', KeyX:'star', Enter:'start', KeyM:'mute', KeyF:'crt'
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Snd.init(); Snd.resume();
  if (mode === 'title') Snd.play('menu');
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  keys[k] = false;
});
function hit(k){ if (pressed[k]) { pressed[k]=false; return true; } return false; }
function clearPressed(){ for (const k in pressed) pressed[k]=false; }

/* =========================== global state =========================== */
let mode = 'title';         // title | fall | landing | boss | dead | win
let T = 0;                  // global frame counter
let shake = 0, shakeX = 0, shakeY = 0;
let flashWhite = 0;
let fadeOut = 0, fadeIn = 0;
let cups = 0;               // gold cups collected (score)
let particles = [];

function addShake(n){ shake = Math.min(9, shake + n); }
function spark(x,y,n,col,spd,life){
  for (let i=0;i<n;i++){
    const a = rnd(0,TAU), s = rnd(spd*0.35, spd);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life||24,L:life||24,c:col||'#ffe9a8',g:0});
  }
}
function updateParticles(){
  for (const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=0.94; p.vy*=0.94; p.l--; }
  particles = particles.filter(p=>p.l>0);
}
function drawParticles(){
  for (const p of particles){
    ctx.globalAlpha = clamp(p.l/p.L,0,1);
    ctx.fillStyle = p.c;
    const s = p.l/p.L > .5 ? 2 : 1;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), s, s);
  }
  ctx.globalAlpha = 1;
}

/* =========================================================================
   ACT 1 — THE SKY FALL
   You drop down a shaft of giant floating cup-rims. Steer into each mouth.
   Perspective: world point (wx,wy) at depth dz projects with scale F/(dz+N).
   ========================================================================= */
const HEARTS = 10;              // how many hearts the hero gets
const FOCAL = 210, NEARZ = 26;
const SHAFT_R = 118;        // outer radius of each rim, in world units
const RING_GAP = 150;       // depth between rims
const RING_COUNT = 14;

const fall = {};
function initFall(){
  fall.px = 0; fall.py = 0;          // player position across the shaft
  fall.vx = 0; fall.vy = 0;
  fall.z = 0;                        // how far we have dropped
  fall.speed = 1.9;
  fall.rings = [];
  fall.pickups = [];
  fall.clouds = [];
  fall.hp = HEARTS*4;                // quarter-hearts
  fall.done = false;
  fall.passed = 0;
  fall.hurt = 0;
  for (let i=0;i<RING_COUNT;i++){
    const hr = Math.max(30, 52 - i*1.6);           // mouth shrinks as you go
    const a  = rnd(0,TAU), d = rnd(0, SHAFT_R - hr - 14);
    fall.rings.push({ z:(i+1)*RING_GAP, hx:Math.cos(a)*d, hy:Math.sin(a)*d, hr, done:false, broke:0, i });
    if (i % 2 === 0){
      const aa = rnd(0,TAU), dd = rnd(10, SHAFT_R-30);
      fall.pickups.push({ z:(i+1)*RING_GAP - RING_GAP*0.5, x:Math.cos(aa)*dd, y:Math.sin(aa)*dd, got:false });
    }
  }
  fall.endZ = RING_COUNT*RING_GAP + 210;
  for (let i=0;i<26;i++) fall.clouds.push({ x:rnd(-200,200), y:rnd(-140,140), z:rnd(40,1900), r:rnd(16,44) });
}

function projScale(dz){ return FOCAL/(dz+NEARZ); }

function updateFall(){
  /* steering */
  const ax = 0.42;
  if (keys.left)  fall.vx -= ax;
  if (keys.right) fall.vx += ax;
  if (keys.up)    fall.vy -= ax;
  if (keys.down)  fall.vy += ax;
  fall.vx *= 0.90; fall.vy *= 0.90;
  fall.px += fall.vx; fall.py += fall.vy;
  /* soft wall at the shaft edge */
  const d = Math.hypot(fall.px, fall.py), lim = SHAFT_R - 16;
  if (d > lim){
    const a = Math.atan2(fall.py, fall.px);
    fall.px = Math.cos(a)*lim; fall.py = Math.sin(a)*lim;
    fall.vx *= -0.35; fall.vy *= -0.35;
  }

  fall.speed = Math.min(4.4, fall.speed + 0.0022);
  fall.z += fall.speed;
  if (fall.hurt > 0) fall.hurt--;

  /* rim collisions */
  for (const r of fall.rings){
    if (r.done) { if (r.broke>0) r.broke--; continue; }
    if (fall.z >= r.z){
      r.done = true;
      const inside = dist(fall.px, fall.py, r.hx, r.hy) < r.hr - 7;
      if (inside){
        fall.passed++;
        Snd.sfxPass();
        spark(W/2, H/2, 10, '#ffe9a8', 3, 20);
      } else {
        r.broke = 22;
        fall.hp -= 2;                       // half a heart
        fall.hurt = 26;
        fall.speed = Math.max(1.5, fall.speed - 1.1);
        addShake(7); Snd.sfxClang();
        spark(W/2, H/2, 18, '#ffd0a0', 4, 26);
        /* nudge toward the mouth so you are never wedged */
        const a = Math.atan2(r.hy-fall.py, r.hx-fall.px);
        fall.vx += Math.cos(a)*2.6; fall.vy += Math.sin(a)*2.6;
        if (fall.hp <= 0) return die();
      }
    }
  }

  /* cups */
  for (const p of fall.pickups){
    if (p.got) continue;
    if (fall.z >= p.z){
      p.got = true;
      if (dist(fall.px, fall.py, p.x, p.y) < 30){
        cups++; Snd.sfxCup();
        spark(W/2, H/2, 12, '#ffdf6e', 3, 26);
      }
    }
  }

  if (fall.z >= fall.endZ && !fall.done){
    fall.done = true;
    mode = 'landing';
    landing.t = 0;
    Snd.sfxLand(); Snd.stop(); addShake(8);
  }
}

function drawFall(){
  /* --- sky --- */
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2b6fd6'); g.addColorStop(.45,'#6fb6f2'); g.addColorStop(1,'#bfe8ff');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  /* --- clouds, parallaxed by depth --- */
  for (const c of fall.clouds){
    let dz = c.z - fall.z;
    if (dz < 6){ c.z += 1900; dz = c.z - fall.z; }
    if (dz > 1900) continue;
    const s = projScale(dz);
    const x = W/2 + (c.x - fall.px)*s, y = H/2 + (c.y - fall.py)*s;
    const r = c.r*s;
    if (r < 1 || x < -r-40 || x > W+r+40 || y < -r-40 || y > H+r+40) continue;
    ctx.globalAlpha = clamp(1 - dz/1900, 0, .85);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(x, y, r, r*0.42, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#dbeeff';
    ctx.beginPath();
    ctx.ellipse(x, y+r*0.22, r*0.8, r*0.26, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* --- the island waiting below --- */
  const dzIsl = fall.endZ - fall.z;
  if (dzIsl < 900){
    const s = projScale(dzIsl);
    const x = W/2 - fall.px*s, y = H/2 - fall.py*s, r = 150*s;
    ctx.fillStyle = '#6b4a2a';
    ctx.beginPath(); ctx.ellipse(x, y+r*0.16, r*0.95, r*0.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4f9a3c';
    ctx.beginPath(); ctx.ellipse(x, y, r, r*0.52, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#6cc44f';
    ctx.beginPath(); ctx.ellipse(x-r*0.2, y-r*0.1, r*0.6, r*0.28, 0, 0, TAU); ctx.fill();
  }

  /* --- the cup rims, far to near --- */
  const list = fall.rings
    .map(r => ({ r, dz: r.z - fall.z }))
    .filter(o => o.dz > -30 && o.dz < 1250)
    .sort((a,b) => b.dz - a.dz);

  for (const o of list){
    const r = o.r, dz = Math.max(o.dz, -30);
    const s = projScale(dz);
    const cx = W/2 - fall.px*s, cy = H/2 - fall.py*s;
    const hx = W/2 + (r.hx - fall.px)*s, hy = H/2 + (r.hy - fall.py)*s;
    const R = SHAFT_R*s, HR = r.hr*s;
    if (R < 2) continue;
    const shade = clamp(1 - dz/1250, 0, 1);
    const broke = r.broke > 0;

    /* thickness — a darker copy behind the top face */
    ring(cx, cy+Math.max(1,3*s*0.35), R, hx, hy+Math.max(1,3*s*0.35), HR,
         shadeCol('#7a4a1e','#3a2410', shade));
    /* top face */
    ring(cx, cy, R, hx, hy, HR, broke ? '#ffb9b9' : shadeCol('#e0a338','#6d4a18', shade));
    /* inner lip highlight */
    ring(cx, cy, R*0.94, hx, hy, HR*0.99, broke ? '#ffe0e0' : shadeCol('#f6d783','#8a6224', shade));
    ring(cx, cy, R*0.80, hx, hy, HR*1.02, broke ? '#ff9d9d' : shadeCol('#c98a2c','#5b3c14', shade));

    /* mouth rim outline */
    ctx.strokeStyle = broke ? '#ffffff' : shadeCol('#5c3a12','#2a1a08', shade);
    ctx.lineWidth = Math.max(1, 2*s);
    ctx.beginPath(); ctx.arc(hx, hy, HR, 0, TAU); ctx.stroke();

    /* a marker so the next mouth reads instantly */
    if (!r.done && o.dz < 520 && o.dz > 40){
      const pulse = 0.55 + 0.45*Math.sin(T*0.16);
      ctx.globalAlpha = clamp((520-o.dz)/520,0,1)*pulse;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(hx, hy, HR+3, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  /* --- floating cups --- */
  for (const p of fall.pickups){
    if (p.got) continue;
    const dz = p.z - fall.z;
    if (dz < 4 || dz > 900) continue;
    const s = projScale(dz);
    const x = W/2 + (p.x - fall.px)*s, y = H/2 + (p.y - fall.py)*s + Math.sin(T*0.08+p.z)*3;
    const sc = clamp(s*1.5, 0.6, 4);
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    ctx.scale(sc, sc);
    ctx.globalAlpha = clamp(1-dz/900,0,1);
    ctx.drawImage(IMG.cup, -IMG.cup.width/2, -IMG.cup.height/2);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* --- speed streaks --- */
  ctx.strokeStyle = 'rgba(255,255,255,.30)';
  ctx.lineWidth = 1;
  for (let i=0;i<14;i++){
    const a = (i*2.39 + T*0.02) % TAU, rr = 34 + ((i*37 + T*7) % 120);
    const x = W/2 + Math.cos(a)*rr, y = H/2 + Math.sin(a)*rr;
    const len = 4 + fall.speed*2.2;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a)*len*0.5, y + Math.sin(a)*len*0.5);
    ctx.stroke();
  }

  drawParticles();

  /* --- the hero, falling toward camera --- */
  const bob = Math.sin(T*0.18)*1.2;
  const fl = fall.hurt > 0 && (T>>1)%2 ? '#ffffff' : null;
  ctx.save();
  ctx.translate(W/2, H/2 + bob);
  ctx.scale(1.7, 1.7);
  ctx.rotate(fall.vx*0.05);
  const src = fl ? tint(IMG.heroJump,'#ffffff') : IMG.heroJump;
  ctx.drawImage(src, 0, 0, 16, 16, -8, -8, 16, 16);
  ctx.restore();

  /* HUD */
  drawHearts(fall.hp);
  drawCupCount();
  const left = RING_COUNT - fall.rings.filter(r=>r.done).length;
  textS('RIMS '+left, 150, 6, '#ffe9a8');
}

/* concentric annulus with an off-centre hole, drawn with even-odd fill */
function ring(cx, cy, R, hx, hy, HR, col){
  if (R <= HR) return;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(cx+R, cy); ctx.arc(cx, cy, R, 0, TAU);
  ctx.moveTo(hx+HR, hy); ctx.arc(hx, hy, HR, 0, TAU);
  ctx.fill('evenodd');
}
function shadeCol(near, far, t){
  const p = (h)=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a = p(near), b = p(far);
  const c = [0,1,2].map(i=>Math.round(lerp(b[i],a[i],t)));
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}

/* =========================== landing beat =========================== */
const landing = { t:0 };
function updateLanding(){
  landing.t++;
  if (landing.t === 60) Snd.sfxRoar();
  if (landing.t > 130){ initBoss(); mode = 'boss'; Snd.play('boss'); }
}
function drawLanding(){
  drawArenaGround();
  const p = clamp(landing.t/30, 0, 1);
  ctx.globalAlpha = 1-p;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 1;
  blit(IMG.shadow,0,0,12,7, W/2-6, H/2+8);
  blit(IMG.heroIdle,0,0,16,16, W/2-8, H/2-8);
  if (landing.t > 26) textCS('THE ISLAND OF CUPS', 30, '#ffe9a8');
  if (landing.t > 62) textCS('SOMETHING IS COMING...', 118, '#ff9a9a');
}

/* =========================================================================
   ACT 2 — THE SKY SERPENT
   Top-down Zelda-style arena. Sword the head; the body just hurts.
   ========================================================================= */
const AW = 320, AH = 224;   // arena is bigger than the screen; camera follows
const boss = {}, hero = {};
let groundCv = null;

function initBoss(){
  hero.x = AW/2; hero.y = AH-56;
  hero.dir = 1;               // 0 down 1 up 2 left 3 right
  hero.vx = 0; hero.vy = 0;
  hero.hp = Math.max(8, fall.hp);
  hero.maxhp = HEARTS*4;
  hero.atk = 0; hero.atkCool = 0;
  hero.stars = []; hero.starCool = 0;
  hero.inv = 0; hero.walkT = 0;
  hero.dead = false;
  hero.kx = 0; hero.ky = 0;

  boss.hp = 24; boss.maxhp = 24;
  boss.x = AW/2; boss.y = 70;
  boss.a = Math.PI/2; boss.spd = 0.95;
  boss.trail = [];
  for (let i=0;i<200;i++) boss.trail.push({x:boss.x, y:boss.y, a:boss.a});
  boss.segs = 7;
  boss.gap = 22;              // trail samples between segments — keeps the
                              // neck clear of the head so the head is hittable
  boss.inv = 0; boss.flash = 0;
  boss.phase = 1;
  boss.tx = rnd(60,AW-60); boss.ty = rnd(50,AH-90);
  boss.retarget = 0;
  boss.shootT = 90;
  boss.charge = 0;
  boss.intro = 40;
  boss.balls = [];
  boss.drops = [];
  boss.wing = 0;
  cam.x = clamp(hero.x-W/2, 0, AW-W);
  cam.y = clamp(hero.y-H/2, 0, AH-H);
}
const cam = { x:0, y:0 };

/* ---- ground painted once into an offscreen canvas ---- */
function buildGround(){
  groundCv = document.createElement('canvas');
  groundCv.width = AW; groundCv.height = AH;
  const g = groundCv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#4a8a34'; g.fillRect(0,0,AW,AH);
  /* dithered grass detail */
  for (let y=0;y<AH;y+=2) for (let x=0;x<AW;x+=2){
    const n = Math.sin(x*0.21)*Math.cos(y*0.17) + Math.sin((x+y)*0.09);
    g.fillStyle = n > 0.65 ? '#5b9d3f' : n < -0.75 ? '#3d7a2b' : null;
    if (g.fillStyle && (n > 0.65 || n < -0.75)) g.fillRect(x,y,2,2);
  }
  /* tufts */
  for (let i=0;i<160;i++){
    const x = (Math.random()*AW)|0, y = (Math.random()*AH)|0;
    g.fillStyle = '#3a7228';
    g.fillRect(x,y,1,2); g.fillRect(x+2,y+1,1,2); g.fillRect(x-2,y+1,1,1);
  }
  /* stone border */
  const B = 14;
  g.fillStyle = '#6c6355';
  g.fillRect(0,0,AW,B); g.fillRect(0,AH-B,AW,B);
  g.fillRect(0,0,B,AH); g.fillRect(AW-B,0,B,AH);
  g.fillStyle = '#857b69';
  for (let x=0;x<AW;x+=16){ g.fillRect(x+1,1,14,5); g.fillRect(x+1,AH-B+1,14,5); }
  for (let y=0;y<AH;y+=16){ g.fillRect(1,y+1,5,14); g.fillRect(AW-B+1,y+1,5,14); }
  g.fillStyle = '#4a4438';
  g.fillRect(0,B-2,AW,2); g.fillRect(0,AH-B,AW,2);
  g.fillRect(B-2,0,2,AH);  g.fillRect(AW-B,0,2,AH);
  /* a ring of stone tiles in the middle, arena flavour */
  g.globalAlpha = .5;
  g.strokeStyle = '#c9bfa6'; g.lineWidth = 3;
  g.beginPath(); g.arc(AW/2, AH/2, 74, 0, TAU); g.stroke();
  g.beginPath(); g.arc(AW/2, AH/2, 60, 0, TAU); g.stroke();
  g.globalAlpha = 1;
}
function drawArenaGround(){
  if (!groundCv) buildGround();
  ctx.drawImage(groundCv, -Math.round(cam.x), -Math.round(cam.y));
}

const BOUND = { x0:18, y0:18, x1:AW-18, y1:AH-18 };

function updateBoss(){
  if (boss.intro > 0){ boss.intro--; }

  /* ---------------- hero ---------------- */
  if (!hero.dead){
    let mx = 0, my = 0;
    if (keys.left) mx--; if (keys.right) mx++;
    if (keys.up) my--;   if (keys.down) my++;
    if (hero.atk > 0) { mx = 0; my = 0; }
    if (mx || my){
      const l = Math.hypot(mx,my);
      mx/=l; my/=l;
      hero.walkT++;
      if (Math.abs(mx) > Math.abs(my)) hero.dir = mx<0 ? 2 : 3;
      else hero.dir = my<0 ? 1 : 0;
    } else hero.walkT = 0;
    const SP = 1.35;
    hero.x += mx*SP + hero.kx;
    hero.y += my*SP + hero.ky;
    hero.kx *= 0.82; hero.ky *= 0.82;
    hero.x = clamp(hero.x, BOUND.x0+6, BOUND.x1-6);
    hero.y = clamp(hero.y, BOUND.y0+8, BOUND.y1-4);

    if (hero.atkCool > 0) hero.atkCool--;
    if (hit('atk') && hero.atk === 0 && hero.atkCool === 0){
      hero.atk = 15; hero.atkCool = 6; Snd.sfxSlash();
    }
    /* ninja stars — unlimited, the reliable way to hurt the serpent */
    if (hero.starCool > 0) hero.starCool--;
    if (hit('star') && hero.starCool === 0){
      hero.starCool = 13;
      const d = hero.dir, SS = 3.6;
      hero.stars.push({
        x: hero.x + (d===2?-6:d===3?6:0),
        y: hero.y - 6 + (d===1?-6:d===0?6:0),
        vx: d===2?-SS:d===3?SS:0,
        vy: d===1?-SS:d===0?SS:0,
        l: 130, spin: 0
      });
      Snd.sfxStar();
    }
    if (hero.atk > 0) hero.atk--;
    if (hero.inv > 0) hero.inv--;
  } else {
    if (hero.deadT !== undefined) hero.deadT++;
  }

  /* camera */
  cam.x = lerp(cam.x, clamp(hero.x-W/2, 0, AW-W), 0.14);
  cam.y = lerp(cam.y, clamp(hero.y-H/2, 0, AH-H), 0.14);

  /* ---------------- serpent ---------------- */
  if (boss.intro === 0 && boss.hp > 0){
    boss.retarget--;
    if (boss.retarget <= 0){
      boss.retarget = boss.phase === 2 ? 55 : 80;
      /* every so often, lunge straight at the hero */
      if (Math.random() < (boss.phase===2 ? .55 : .34)){
        boss.tx = hero.x; boss.ty = hero.y; boss.charge = 55;
      } else {
        boss.tx = rnd(BOUND.x0+40, BOUND.x1-40);
        boss.ty = rnd(BOUND.y0+30, BOUND.y1-50);
      }
    }
    if (boss.charge > 0) boss.charge--;

    const want = Math.atan2(boss.ty-boss.y, boss.tx-boss.x);
    let d = ((want - boss.a + Math.PI*3) % TAU) - Math.PI;
    const turn = boss.phase === 2 ? 0.055 : 0.040;
    boss.a += clamp(d, -turn, turn);
    const spd = (boss.phase === 2 ? 1.45 : 1.05) * (boss.charge>0 ? 1.5 : 1);
    boss.x += Math.cos(boss.a)*spd;
    boss.y += Math.sin(boss.a)*spd;
    /* bounce off the walls */
    if (boss.x < BOUND.x0+24 || boss.x > BOUND.x1-24){
      boss.x = clamp(boss.x, BOUND.x0+24, BOUND.x1-24);
      boss.a = Math.PI - boss.a; boss.retarget = 0;
    }
    if (boss.y < BOUND.y0+20 || boss.y > BOUND.y1-30){
      boss.y = clamp(boss.y, BOUND.y0+20, BOUND.y1-30);
      boss.a = -boss.a; boss.retarget = 0;
    }
    if (dist(boss.x,boss.y,boss.tx,boss.ty) < 22) boss.retarget = 0;

    boss.trail.unshift({ x:boss.x, y:boss.y, a:boss.a });
    if (boss.trail.length > 260) boss.trail.pop();

    /* fire */
    boss.shootT--;
    if (boss.shootT <= 0){
      boss.shootT = boss.phase === 2 ? 125 : 170;
      const base = Math.atan2(hero.y-boss.y, hero.x-boss.x);
      const n = boss.phase === 2 ? 3 : 1;
      for (let i=0;i<n;i++){
        const a = base + (i-(n-1)/2)*0.28;
        boss.balls.push({ x:boss.x, y:boss.y, vx:Math.cos(a)*1.25, vy:Math.sin(a)*1.25, l:150, f:0 });
      }
      if (boss.phase === 2 && Math.random() < 0.20){
        for (let i=0;i<6;i++){
          const a = i/6*TAU + T*0.01;
          boss.balls.push({ x:boss.x, y:boss.y, vx:Math.cos(a)*1.0, vy:Math.sin(a)*1.0, l:140, f:0 });
        }
      }
      Snd.tone(150, Snd.now(), .18, 'sawtooth', .12);
    }
  }
  if (boss.inv > 0) boss.inv--;
  if (boss.flash > 0) boss.flash--;
  boss.wing += boss.charge > 0 ? 0.34 : 0.20;

  /* fireballs */
  for (const b of boss.balls){
    b.x += b.vx; b.y += b.vy; b.l--; b.f += 0.28;
    if (b.x < BOUND.x0 || b.x > BOUND.x1 || b.y < BOUND.y0 || b.y > BOUND.y1) b.l = 0;
    if (!hero.dead && hero.inv === 0 && dist(b.x,b.y,hero.x,hero.y-6) < 10){
      b.l = 0; hurtHero(1, b.x, b.y);
    }
  }
  boss.balls = boss.balls.filter(b => b.l > 0);

  /* ---------------- ninja stars ---------------- */
  for (const st of hero.stars){
    /* home in a little — a kid should not have to line the shot up exactly */
    if (boss.hp > 0 && boss.intro === 0){
      let best = null, bd = 1e9;
      for (const p of bossParts()){
        const d = dist(st.x, st.y, p.x, p.y);
        if (d < bd){ bd = d; best = p; }
      }
      if (best && bd < 130){
        const want = Math.atan2(best.y-st.y, best.x-st.x);
        const cur  = Math.atan2(st.vy, st.vx);
        const da   = ((want - cur + Math.PI*3) % TAU) - Math.PI;
        const na   = cur + clamp(da, -0.10, 0.10);
        const sp   = Math.hypot(st.vx, st.vy) || 3.6;
        st.vx = Math.cos(na)*sp; st.vy = Math.sin(na)*sp;
      }
    }
    st.x += st.vx; st.y += st.vy; st.l--; st.spin += 0.55;
    if (st.x < BOUND.x0 || st.x > BOUND.x1 || st.y < BOUND.y0 || st.y > BOUND.y1) st.l = 0;
    if (st.l > 0 && boss.hp > 0 && boss.intro === 0 && boss.inv === 0){
      for (const p of bossParts()){
        if (dist(st.x, st.y, p.x, p.y) < p.r){ st.l = 0; damageBoss(false, p.x, p.y); break; }
      }
    }
  }
  hero.stars = hero.stars.filter(st => st.l > 0);

  /* ---------------- sword vs. head ---------------- */
  if (hero.atk > 2 && hero.atk < 14 && boss.inv === 0 && boss.hp > 0 && boss.intro === 0){
    const rng = 18;
    const sx = hero.x + (hero.dir===2?-rng:hero.dir===3?rng:0);
    const sy = hero.y - 6 + (hero.dir===1?-rng:hero.dir===0?rng:0);
    for (const p of bossParts()){
      if (dist(sx, sy, p.x, p.y) < p.r + 7){ damageBoss(true, p.x, p.y); break; }
    }
  }

  /* ---------------- body vs. hero ---------------- */
  if (!hero.dead && hero.inv === 0 && boss.hp > 0 && boss.intro === 0){
    if (dist(hero.x, hero.y-6, boss.x, boss.y) < 18) hurtHero(2, boss.x, boss.y);
  }

  /* ---------------- drops ---------------- */
  for (const d of boss.drops){
    d.t++;
    if (!hero.dead && dist(d.x, d.y, hero.x, hero.y-4) < 12){
      d.t = 9999;
      if (d.kind === 'cup'){ cups++; Snd.sfxCup(); }
      else { hero.hp = Math.min(hero.maxhp, hero.hp+4); Snd.sfxHeart(); }
      spark(d.x-cam.x, d.y-cam.y, 8, '#ffdf6e', 2.4, 20);
    }
  }
  boss.drops = boss.drops.filter(d => d.t < 600);
}

/* head, every body link and the tail — all of it can be hit */
function bossParts(){
  const parts = [{ x:boss.x, y:boss.y, r:22 }];
  for (let i=1;i<=boss.segs;i++){
    const t = boss.trail[Math.min(boss.trail.length-1, i*boss.gap)];
    if (t) parts.push({ x:t.x, y:t.y, r:16 });
  }
  const tl = boss.trail[Math.min(boss.trail.length-1, (boss.segs+1)*boss.gap)];
  if (tl) parts.push({ x:tl.x, y:tl.y, r:15 });
  return parts;
}

function damageBoss(knockHero, hx, hy){
  if (hx === undefined){ hx = boss.x; hy = boss.y; }
  boss.hp--; boss.inv = 20; boss.flash = 12;
  addShake(6); Snd.sfxHitBoss();
  spark(hx-cam.x, hy-cam.y, 14, '#bff0ff', 3.2, 24);
  if (knockHero){
    const a = Math.atan2(hero.y-hy, hero.x-hx);
    hero.kx = Math.cos(a)*2.6; hero.ky = Math.sin(a)*2.6;
  }
  if (Math.random() < 0.32) boss.drops.push({ x:hx, y:hy, t:0, kind:'cup' });
  else if (hero.hp < hero.maxhp && Math.random() < 0.34) boss.drops.push({ x:hx, y:hy, t:0, kind:'heart' });

  if (boss.hp === 12){
    boss.phase = 2; boss.flash = 30; addShake(9);
    Snd.sfxRoar(); flashWhite = 8;
  }
  if (boss.hp <= 0){
    boss.hp = 0;
    mode = 'win'; winT = 0;
    Snd.stop(); Snd.sfxWin(); addShake(10); flashWhite = 12;
    for (let i=0;i<40;i++) spark(boss.x-cam.x, boss.y-cam.y, 1, i%2?'#ffe9a8':'#bff0ff', 5, 60);
  }
}

function hurtHero(dmg, fx, fy){
  hero.hp -= dmg;
  hero.inv = 95;
  addShake(6); Snd.sfxHurt();
  const a = Math.atan2(hero.y-fy, hero.x-fx);
  hero.kx = Math.cos(a)*3.4; hero.ky = Math.sin(a)*3.4;
  spark(hero.x-cam.x, hero.y-cam.y-6, 10, '#ff8a8a', 3, 22);
  if (hero.hp <= 0){ hero.hp = 0; die(); }
}
function die(){
  deadFrom = (mode === 'fall') ? 'fall' : 'boss';
  hero.dead = true; hero.deadT = 0;
  mode = 'dead'; deadT = 0;
  Snd.stop(); Snd.sfxDead();
}

/* ---------- drawing the arena ---------- */
function drawBoss(){
  drawArenaGround();
  const ox = -Math.round(cam.x), oy = -Math.round(cam.y);

  /* drops */
  for (const d of boss.drops){
    if (d.t > 500 && (T>>2)%2) continue;
    const y = d.y + Math.sin(d.t*0.12)*2;
    if (d.kind === 'cup') ctx.drawImage(IMG.cup, Math.round(d.x+ox-4), Math.round(y+oy-6));
    else blit(IMG.heart, 4*16,0,16,16, d.x+ox-8, y+oy-8);
  }

  /* --- serpent: shadows, then tail -> head --- */
  const segPos = [];
  for (let i=boss.segs; i>=1; i--){
    const t = boss.trail[Math.min(boss.trail.length-1, i*boss.gap)];
    if (t) segPos.push({ t, i });
  }
  ctx.globalAlpha = .28; ctx.fillStyle = '#000000';
  for (const s of segPos){
    ctx.beginPath(); ctx.ellipse(s.t.x+ox, s.t.y+oy+11, 11, 4, 0, 0, TAU); ctx.fill();
  }
  ctx.beginPath(); ctx.ellipse(boss.x+ox, boss.y+oy+13, 15, 5, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  const fl = boss.flash > 0 && (T>>1)%2 ? '#ffffff' : (boss.phase===2 ? null : null);
  const bob = i => Math.sin(T*0.11 - i*0.6)*1.6;

  if (boss.hp > 0 || mode === 'win'){
    /* tail */
    const tailT = boss.trail[Math.min(boss.trail.length-1, (boss.segs+1)*boss.gap)];
    if (tailT) blitRot(IMG.dTail, 0,0, IMG.dTail.width, IMG.dTail.height,
                       tailT.x+ox, tailT.y+oy+bob(boss.segs+1), tailT.a+Math.PI/2, 1,1, fl);
    /* body links, far to near */
    for (const s of segPos){
      const img = s.i%2 ? IMG.dBody1 : IMG.dBody2;
      blitRot(img, 0,0, img.width, img.height,
              s.t.x+ox, s.t.y+oy+bob(s.i), s.t.a+Math.PI/2, 1,1, fl);
    }
    /* wings on the head */
    const flap = Math.sin(boss.wing);
    const wa = boss.a - Math.PI/2;
    const wOff = 16;
    ctx.save();
    ctx.translate(Math.round(boss.x+ox), Math.round(boss.y+oy+bob(0)));
    ctx.rotate(wa);
    for (const side of [-1, 1]){
      ctx.save();
      ctx.translate(side*wOff, -2);
      ctx.scale(side * (0.72 + flap*0.28), 0.94 + flap*0.10);
      const wi = fl ? tint(IMG.dWing, fl) : IMG.dWing;
      ctx.drawImage(wi, -IMG.dWing.width/2, -IMG.dWing.height/2);
      ctx.restore();
    }
    ctx.restore();
    /* head */
    blitRot(IMG.dHead, 0,0, IMG.dHead.width, IMG.dHead.height,
            boss.x+ox, boss.y+oy+bob(0), boss.a-Math.PI/2, 1,1, fl);
    /* phase-2 rage glow */
    if (boss.phase === 2 && !fl){
      ctx.globalAlpha = 0.20 + 0.12*Math.sin(T*0.2);
      ctx.globalCompositeOperation = 'lighter';
      blitRot(tint(IMG.dHead,'#ff3a2a'), 0,0, IMG.dHead.width, IMG.dHead.height,
              boss.x+ox, boss.y+oy+bob(0), boss.a-Math.PI/2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
  }

  /* fireballs */
  for (const b of boss.balls){
    const fr = (b.f|0) % 4;
    blitRot(IMG.fireball, fr*16, 0, 16, 16, b.x+ox, b.y+oy, Math.atan2(b.vy,b.vx)-Math.PI/2);
  }

  /* --- ninja stars --- */
  for (const st of hero.stars){
    const fr = ((st.spin*2)|0) % 2;
    blitRot(IMG.star, fr*16, 0, 16, 16, st.x+ox, st.y+oy, st.spin);
  }

  /* --- hero --- */
  if (!hero.dead){
    const blink = hero.inv > 0 && (T>>1)%2;
    if (!blink){
      ctx.globalAlpha = .30; ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(hero.x+ox, hero.y+oy+5, 6, 2.5, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      const dx = hero.x+ox-8, dy = hero.y+oy-14;
      if (hero.atk > 0){
        blit(IMG.heroAtk, hero.dir*16, 0, 16, 16, dx, dy);
        /* slash arc in front */
        const fr = clamp(4 - Math.floor(hero.atk/3.2), 0, 4);
        const ang = [0, Math.PI, Math.PI*0.5, Math.PI*1.5][hero.dir];
        const rr = 14;
        const sx = hero.x+ox + (hero.dir===2?-rr:hero.dir===3?rr:0);
        const sy = hero.y+oy-6 + (hero.dir===1?-rr:hero.dir===0?rr:0);
        ctx.globalAlpha = 0.9;
        blitRot(IMG.slash, fr*26, 0, 26, 32, sx, sy, ang);
        ctx.globalAlpha = 1;
      } else if (hero.walkT > 0){
        const fr = (hero.walkT>>3) % 4;
        blit(IMG.heroWalk, hero.dir*16, fr*16, 16, 16, dx, dy);
      } else {
        blit(IMG.heroIdle, hero.dir*16, 0, 16, 16, dx, dy);
      }
    }
  } else {
    blit(IMG.heroDead, 0,0,16,16, hero.x+ox-8, hero.y+oy-14);
  }

  drawParticles();

  /* --- HUD --- */
  drawHearts(hero.hp);
  drawCupCount();
  /* boss bar */
  const bw = 96, bx = (W-bw)/2, by = H-11;
  ctx.fillStyle = '#101422'; ctx.fillRect(bx-2, by-2, bw+4, 8);
  ctx.fillStyle = '#3a2030'; ctx.fillRect(bx, by, bw, 4);
  const pct = boss.hp/boss.maxhp;
  ctx.fillStyle = boss.phase===2 ? '#ff4a3a' : '#5ad0ff';
  ctx.fillRect(bx, by, Math.round(bw*pct), 4);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(bx, by, Math.round(bw*pct), 1);
  textS('SKY SERPENT', bx+6, by-11, boss.phase===2 ? '#ff9a8a' : '#bff0ff');

  if (boss.intro > 0){
    textCS('THE SKY SERPENT AWAKES', 36, '#ffe9a8');
    textCS('SPACE = NINJA STAR', 48, '#bff0ff');
    textCS('HIT IT ANYWHERE!', 58, '#ffffff');
    textCS('ONLY THE FACE BITES', 68, '#ff9a9a');
  }
}

function drawHearts(hp){
  for (let i=0;i<HEARTS;i++){
    const f = clamp(hp - i*4, 0, 4);
    blit(IMG.heart, f*16, 0, 16, 16, 2 + i*13, 2);
  }
}
function drawCupCount(){
  ctx.drawImage(IMG.cup, W-27, 5);
  textS(String(cups).padStart(2,'0'), W-17, 6, '#ffdf6e');
}

/* =========================== title / end screens =========================== */
let titleT = 0, deadT = 0, winT = 0;
let deadFrom = 'boss';

function drawTitle(){
  titleT++;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141a2e'); g.addColorStop(.6,'#26407a'); g.addColorStop(1,'#4b7fc4');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  /* drifting stars */
  for (let i=0;i<40;i++){
    const x = (i*97 + titleT*0.25) % W, y = (i*53) % 70;
    ctx.globalAlpha = 0.25 + 0.5*Math.abs(Math.sin(i+titleT*0.03));
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x|0, y|0, 1, 1);
  }
  ctx.globalAlpha = 1;
  /* a rim drifting past */
  const s = 1.1 + Math.sin(titleT*0.012)*0.14;
  ring(W/2, 118, 150*s, W/2+26, 118, 44*s, '#7a4a1e');
  ring(W/2, 115, 150*s, W/2+26, 115, 44*s, '#e0a338');
  ring(W/2, 115, 141*s, W/2+26, 115, 43.5*s, '#f6d783');
  ring(W/2, 115, 120*s, W/2+26, 115, 45*s, '#c98a2c');

  /* serpent silhouette swimming behind the title */
  for (let i=8;i>=0;i--){
    const a = titleT*0.02 - i*0.30;
    const x = W/2 + Math.cos(a)*74, y = 58 + Math.sin(a*1.6)*15;
    const img = i===0 ? IMG.dHead : (i%2 ? IMG.dBody1 : IMG.dBody2);
    ctx.globalAlpha = .95;
    blitRot(img, 0,0, img.width, img.height, x, y, a+(i===0?-Math.PI/2:Math.PI/2), .62, .62);
  }
  ctx.globalAlpha = 1;

  textCS('CUP OF THE', 22, '#ffe9a8');
  textCS('SKY DRAGON', 32, '#ffd23a');

  if ((titleT>>4)%2) textCS('PRESS SPACE TO START', 104, '#ffffff');
  textCS('ARROWS / WASD  MOVE', 120, '#bcd4f0');
  textCS('SPACE  NINJA STAR', 129, '#ffe9a8');
  textCS('Z  SWORD    M  MUTE    F  CRT', 138, '#8fb0d8');
  textCS('ART: NINJA ADVENTURE  CC0', 148, '#7f8aa8');

  if (hit('start') || hit('star') || hit('atk')){ Snd.sfxSelect(); startRun(); }
}

function drawDead(){
  deadT++;
  if (deadFrom === 'fall') drawFall(); else drawBoss();
  ctx.fillStyle = 'rgba(10,6,14,'+clamp(deadT/60,0,.78)+')';
  ctx.fillRect(0,0,W,H);
  if (deadT > 24) textCS('YOU FELL', 62, '#ff6a6a');
  if (deadT > 44) textCS('CUPS COLLECTED  '+cups, 80, '#ffdf6e');
  if (deadT > 70 && (deadT>>4)%2) textCS('PRESS SPACE TO TRY AGAIN', 108, '#ffffff');
  if (deadT > 70 && (hit('start') || hit('star') || hit('atk'))){ Snd.sfxSelect(); startRun(); }
}

function drawWin(){
  winT++;
  drawBoss();
  ctx.fillStyle = 'rgba(255,250,230,'+clamp((30-winT)/30,0,.9)+')';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(8,14,26,'+clamp((winT-30)/70,0,.72)+')';
  ctx.fillRect(0,0,W,H);
  if (winT > 40) textCS('SERPENT SLAIN!', 54, '#ffd23a');
  if (winT > 64){
    textCS('CUPS COLLECTED  '+cups, 76, '#ffdf6e');
    ctx.drawImage(IMG.cup, W/2-5, 88);
  }
  if (winT > 100 && (winT>>4)%2) textCS('PRESS SPACE TO PLAY AGAIN', 118, '#ffffff');
  if (winT > 100 && (hit('start') || hit('star') || hit('atk'))){ Snd.sfxSelect(); startRun(); }
  if (winT % 14 === 0) spark(rnd(40,W-40), rnd(30,110), 6, ['#ffd23a','#bff0ff','#ff8ad0'][winT%3], 2.4, 40);
}

function startRun(){
  cups = 0; particles = [];
  initFall();
  mode = 'fall';
  Snd.play('sky');
  clearPressed();
}

/* =========================== main loop =========================== */
const crtEl = document.getElementById('crt');
function boot(){
  document.getElementById('boot').style.display = 'none';
  buildGround();
  requestAnimationFrame(loop);
}

let acc = 0, last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = now - last; last = now;
  if (dt > 200) dt = 200;
  acc += dt;
  const STEP = 1000/60;
  let guard = 0;
  while (acc >= STEP && guard++ < 5){ step(); acc -= STEP; }
  render();
}

function step(){
  T++;
  if (hit('mute')) Snd.toggle();
  if (hit('crt')) crtEl.classList.toggle('off');
  updateParticles();
  if (shake > 0){
    shake *= 0.86; if (shake < 0.3) shake = 0;
    shakeX = rnd(-shake, shake); shakeY = rnd(-shake, shake);
  } else { shakeX = shakeY = 0; }
  if (flashWhite > 0) flashWhite--;

  if (mode === 'fall')    updateFall();
  else if (mode === 'landing') updateLanding();
  else if (mode === 'boss')    updateBoss();
  else if (mode === 'dead' || mode === 'win'){ /* handled in draw */ }
}

function render(){
  ctx.save();
  ctx.translate(Math.round(shakeX), Math.round(shakeY));
  ctx.fillStyle = '#000'; ctx.fillRect(-10,-10,W+20,H+20);

  if (mode === 'title')        drawTitle();
  else if (mode === 'fall')    drawFall();
  else if (mode === 'landing') drawLanding();
  else if (mode === 'boss')    drawBoss();
  else if (mode === 'dead')    drawDead();
  else if (mode === 'win')     drawWin();

  if (flashWhite > 0){
    ctx.globalAlpha = flashWhite/14;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  clearPressed();
}
</script>
