const W = 240, H = 160;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const stage = document.getElementById('stage');
function fit(){
  const s = Math.max(1, Math.min(Math.floor(innerWidth/W), Math.floor((innerHeight-20)/H)));
  stage.style.width = (W*s)+'px'; stage.style.height = (H*s)+'px';
  cv.style.width = (W*s)+'px';    cv.style.height = (H*s)+'px';
}
addEventListener('resize', fit); fit();

const IMG = {};
let pending = 0;
for (const k in ASSETS){
  pending++;
  const im = new Image();
  im.onload  = () => { if(--pending === 0) boot(); };
  im.onerror = () => { if(--pending === 0) boot(); };
  im.src = ASSETS[k];
  IMG[k] = im;
}

/* =========================== helpers =========================== */
const TAU = Math.PI*2;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;
const rnd   = (a,b) => a+Math.random()*(b-a);
const dist  = (x1,y1,x2,y2) => Math.hypot(x2-x1,y2-y1);

const tintCache = new Map();
function tint(img, col){
  const key = img.src.slice(-24)+col;
  let c = tintCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(img,0,0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = col; g.fillRect(0,0,c.width,c.height);
  tintCache.set(key,c);
  return c;
}

/* A proper greyscale copy, so a locked character still reads as that
   character rather than a black blob. */
const greyCache = new Map();
function grey(img){
  const key = img.src.slice(-24);
  let c = greyCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(img, 0, 0);
  try {
    const d = g.getImageData(0, 0, c.width, c.height), px = d.data;
    for (let i=0;i<px.length;i+=4){
      const lum = px[i]*0.30 + px[i+1]*0.59 + px[i+2]*0.11;
      const v = Math.round(lum*0.66 + 30);
      px[i] = v; px[i+1] = v; px[i+2] = v;
    }
    g.putImageData(d, 0, 0);
  } catch(e){ /* if pixels are ever unreadable the plain copy still shows */ }
  greyCache.set(key, c);
  return c;
}

const GW = 8, ADV = 7;
function text(s, x, y, col){
  const f = tint(IMG.font, col || '#f4f6ff');
  s = String(s);
  for (let i=0;i<s.length;i++){
    const c = s.charCodeAt(i)-32;
    if (c < 0) continue;
    ctx.drawImage(f, (c%15)*GW, (c/15|0)*GW, GW, GW, Math.round(x+i*ADV), Math.round(y), GW, GW);
  }
}
const textW = s => String(s).length*ADV;
function textS(s, x, y, col, sh){ text(s, x+1, y+1, sh || '#101422'); text(s, x, y, col); }
function textCS(s, y, col, sh){ textS(s, Math.round((W-textW(s))/2), y, col, sh); }

function blit(img, sx, sy, sw, sh, dx, dy, flip, sc){
  sc = sc || 1;
  dx = Math.round(dx); dy = Math.round(dy);
  if (flip){
    ctx.save(); ctx.translate(dx+sw*sc, dy); ctx.scale(-1,1);
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw*sc, sh*sc);
    ctx.restore();
  } else {
    ctx.drawImage(img, sx, sy, sw, sh, dx, dy, sw*sc, sh*sc);
  }
}
function blitRot(img, sx, sy, sw, sh, cx, cy, ang, kx, ky){
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.rotate(ang);
  ctx.scale(kx===undefined?1:kx, ky===undefined?1:ky);
  ctx.drawImage(img, sx, sy, sw, sh, -sw/2, -sh/2, sw, sh);
  ctx.restore();
}

/* =========================== audio =========================== */

/* A small chiptune/EDM engine: detuned saw lead, filtered saw bass with a
   sine sub, square arps, a drum machine, a tempo-locked delay send, and
   kick-triggered sidechain ducking across the whole music bus. */
const NOTE = { c:0, cs:1, d:2, ds:3, e:4, f:5, fs:6, g:7, gs:8, a:9, as:10, b:11 };
function n2m(s){
  const m = /^([a-g]s?)(-?\d+)$/.exec(s);
  return m ? NOTE[m[1]] + (parseInt(m[2],10)+1)*12 : null;
}
const P = str => str.trim().split(/\s+/).map(t => t === '.' ? null : n2m(t));
const D = str => str.trim().split(/\s+/);

const Snd = {
  ctx:null, muted:false, songName:null, song:null, step:0, nextT:0, timer:null,

  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();

    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -15; this.comp.ratio.value = 6;
    this.comp.attack.value = 0.004; this.comp.release.value = 0.18;
    this.master = c.createGain(); this.master.gain.value = 0.34;
    this.comp.connect(this.master); this.master.connect(c.destination);

    this.sfxGain = c.createGain(); this.sfxGain.gain.value = 1;
    this.sfxGain.connect(this.comp);

    /* music bus -> sidechain duck -> level -> compressor */
    this.musicBus = c.createGain(); this.musicBus.gain.value = 1;
    this.duck     = c.createGain(); this.duck.gain.value = 1;
    this.musicVol = c.createGain(); this.musicVol.gain.value = 0.52;
    this.musicBus.connect(this.duck);
    this.duck.connect(this.musicVol);
    this.musicVol.connect(this.comp);

    /* feedback delay, fed by the lead and arp only */
    this.delay = c.createDelay(1.5);
    this.delay.delayTime.value = 0.26;
    this.fb  = c.createGain(); this.fb.gain.value = 0.33;
    this.wet = c.createGain(); this.wet.gain.value = 0.34;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 520;
    this.delay.connect(this.fb); this.fb.connect(this.delay);
    this.delay.connect(hp); hp.connect(this.wet); this.wet.connect(this.musicBus);
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggle(){
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.34;
  },
  now(){ return this.ctx ? this.ctx.currentTime : 0; },
  midi(n){ return 440*Math.pow(2,(n-69)/12); },

  /* ---------- generic voices, also used by the sfx ---------- */
  tone(freq, t, dur, type, vol, dest){
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(t); o.stop(t+dur+0.02);
  },
  slide(f1, f2, t, dur, type, vol){
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(t, dur, vol, hp, dest){
    if (!this.ctx) return;
    const n = Math.max(1, Math.floor(this.ctx.sampleRate*dur));
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1-i/n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 800;
    const g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(dest || this.sfxGain);
    s.start(t);
  },

  /* ---------- musical voices ---------- */
  lead(f, t, dur, vol){
    const c = this.ctx; if (!c) return;
    const flt = c.createBiquadFilter();
    flt.type = 'lowpass'; flt.Q.value = 7;
    flt.frequency.setValueAtTime(700, t);
    flt.frequency.exponentialRampToValueAtTime(4600, t+0.05);
    flt.frequency.exponentialRampToValueAtTime(1100, t+dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    for (const det of [-9, 9]){
      const o = c.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
      o.connect(flt); o.start(t); o.stop(t+dur+0.03);
    }
    const sq = c.createOscillator(); sq.type = 'square'; sq.frequency.value = f*2;
    const sg = c.createGain(); sg.gain.value = 0.22;
    sq.connect(sg); sg.connect(flt); sq.start(t); sq.stop(t+dur+0.03);
    flt.connect(g); g.connect(this.musicBus); g.connect(this.delay);
  },
  bassV(f, t, dur, vol){
    const c = this.ctx; if (!c) return;
    const flt = c.createBiquadFilter();
    flt.type = 'lowpass'; flt.Q.value = 9;
    flt.frequency.setValueAtTime(2400, t);
    flt.frequency.exponentialRampToValueAtTime(240, t+Math.min(dur, 0.20));
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const sub = c.createOscillator(); sub.type = 'sine'; sub.frequency.value = f/2;
    const sg = c.createGain(); sg.gain.value = 0.85;
    o.connect(flt); sub.connect(sg); sg.connect(flt);
    flt.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t+dur+0.02); sub.start(t); sub.stop(t+dur+0.02);
  },
  pluck(f, t, dur, vol){
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(); o.type = 'square'; o.frequency.value = f;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.musicBus); g.connect(this.delay);
    o.start(t); o.stop(t+dur+0.02);
  },

  /* ---------- drums ---------- */
  duckAt(t){
    if (!this.duck) return;
    const d = this.duck.gain;
    d.cancelScheduledValues(t);
    d.setValueAtTime(0.44, t);
    d.linearRampToValueAtTime(1, t+0.17);
  },
  kick(t){
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(44, t+0.11);
    const g = c.createGain();
    g.gain.setValueAtTime(0.95, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.21);
    o.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t+0.23);
    this.noise(t, 0.012, 0.20, 2000, this.musicBus);
    this.duckAt(t);
  },
  snare(t){
    const c = this.ctx; if (!c) return;
    this.noise(t, 0.17, 0.42, 1500, this.musicBus);
    const o = c.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(230, t);
    o.frequency.exponentialRampToValueAtTime(150, t+0.1);
    const g = c.createGain();
    g.gain.setValueAtTime(0.32, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.13);
    o.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t+0.15);
  },
  hat(t, open){ this.noise(t, open?0.17:0.032, open?0.13:0.12, 7500, this.musicBus); },

  /* ---------- sfx ---------- */
  sfxPass(){ const t=this.now(); this.tone(880,t,.07,'square',.16); this.tone(1320,t+.05,.09,'square',.13); },
  sfxClang(){ const t=this.now(); this.noise(t,.14,.22,1800); this.tone(180,t,.12,'square',.14); },
  sfxCup(){ const t=this.now(); [1046,1318,1568].forEach((f,i)=>this.tone(f,t+i*.045,.10,'square',.14)); },
  sfxStar(){ const t=this.now(); this.noise(t,.05,.10,3000); this.slide(1200,600,t,.10,'square',.09); },
  sfxSlash(){ const t=this.now(); this.noise(t,.09,.16,2400); this.slide(720,300,t,.09,'sawtooth',.10); },
  sfxHitBoss(){ const t=this.now(); this.tone(300,t,.09,'square',.20); this.tone(180,t+.05,.14,'square',.16); this.noise(t,.10,.14,900); },
  sfxHurt(){ const t=this.now(); this.slide(420,110,t,.28,'sawtooth',.20); this.noise(t,.12,.12,500); },
  sfxHeart(){ const t=this.now(); [784,1046,1318].forEach((f,i)=>this.tone(f,t+i*.06,.12,'triangle',.16)); },
  sfxRoar(){ const t=this.now(); this.slide(220,60,t,.55,'sawtooth',.24); this.slide(150,48,t+.05,.55,'square',.14); this.noise(t,.5,.10,200); },
  sfxLand(){ const t=this.now(); this.noise(t,.22,.24,300); this.slide(200,70,t,.22,'square',.16); },
  sfxWin(){ const t=this.now(); [523,659,784,1046,1318,1568].forEach((f,i)=>this.tone(f,t+i*.11,.30,'square',.16)); },
  sfxDead(){ const t=this.now(); [440,392,330,262,196].forEach((f,i)=>this.tone(f,t+i*.15,.30,'square',.16)); },
  sfxSelect(){ const t=this.now(); this.tone(660,t,.06,'square',.16); this.tone(990,t+.06,.10,'square',.14); },

  /* ---------- sequencer ---------- */
  play(name){
    this.init(); this.resume();
    if (!this.ctx || this.songName === name) return;
    this.songName = name;
    this.song = SONGS[name];
    this.step = 0;
    this.nextT = this.ctx.currentTime + 0.08;
    /* a dotted-eighth echo locks the delay to the tempo */
    this.delay.delayTime.value = (60/this.song.bpm)*0.75;
    if (!this.timer) this.timer = setInterval(() => this.pump(), 25);
  },
  stop(){ this.songName = null; this.song = null; },
  pump(){
    if (!this.ctx || !this.song) return;
    const s = this.song, sp = 60/s.bpm/4;
    while (this.nextT < this.ctx.currentTime + 0.15){
      const i = this.step % s.len, t = this.nextT;
      const L = s.lead[i], B = s.bass[i], A = s.arp[i], dr = s.drum[i] || '.';
      if (L != null) this.lead(this.midi(L),  t, sp*1.9,  0.20);
      if (B != null) this.bassV(this.midi(B), t, sp*1.7,  0.34);
      if (A != null) this.pluck(this.midi(A), t, sp*0.75, 0.075);
      if (dr.indexOf('K') >= 0) this.kick(t);
      if (dr.indexOf('S') >= 0) this.snare(t);
      if (dr.indexOf('H') >= 0) this.hat(t, true);
      else if (dr.indexOf('h') >= 0) this.hat(t, false);
      this.nextT += sp; this.step++;
    }
  }
};



/* ---- recorded effects from the pack, folded to 22kHz mono ---- */
const BUF = {};
let samplesRequested = false;
function loadSamples(){
  if (samplesRequested || !Snd.ctx) return;
  samplesRequested = true;
  for (const k in SFX){
    try {
      const bin = atob(SFX[k].split(',')[1]);
      const arr = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      Snd.ctx.decodeAudioData(arr.buffer, b => { BUF[k] = b; }, () => {});
    } catch(e){ /* the synth covers for us */ }
  }
}
function sample(name, vol, rate){
  const b = BUF[name];
  if (!b || !Snd.ctx) return false;
  const s = Snd.ctx.createBufferSource();
  s.buffer = b;
  try { s.playbackRate.value = rate || 1; } catch(e){}
  const g = Snd.ctx.createGain();
  g.gain.value = vol === undefined ? 0.6 : vol;
  s.connect(g); g.connect(Snd.sfxGain);
  s.start();
  return true;
}

Snd.sfxSplash = function(){ if(!sample('sSplash',.55)) this.noise(this.now(),.25,.20,300); };
Snd.sfxBark   = function(){ sample('sDog',.34,rnd(.92,1.10)); };
Snd.sfxLand   = function(){ if(!sample('sLand',.26,rnd(.95,1.08))) _land.call(this); };
Snd.sfxHurt   = function(){ if(!sample('sHurt',.55)) _hurt.call(this); };
Snd.sfxHeart  = function(){ if(!sample('sHeart',.45)) _heart.call(this); };

/* =========================== input =========================== */
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  Space:'act', KeyZ:'act', KeyX:'act', KeyJ:'act',
  Enter:'start', KeyM:'mute', KeyF:'crt'
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Snd.init(); Snd.resume(); loadSamples();
  if (mode === 'title') Snd.play('menu');
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  keys[k] = false;
});
function hit(k){ if (pressed[k]) { pressed[k]=false; return true; } return false; }
function clearPressed(){ for (const k in pressed) pressed[k]=false; }

/* =========================================================================
   ACT 1 — THE RIVER RUN
   ========================================================================= */
const WATER_Y = 140, DROWN_Y = 190;
const GRAV = 0.40, JUMP = -7.0;
const cam = { x:0, y:0 };

function makeHippo(x, y, scale, type){
  return { x, y, baseY:y, scale, w:17*scale, h:16*scale, type,
           seed: rnd(0,10), sink:0, sinking:false, gone:0 };
}
function hippoTop(h){
  if (h.type === 'flag')  return h.baseY;
  if (h.type === 'bob')   return h.baseY + Math.sin(T*0.028 + h.seed)*13;
  if (h.type === 'sink')  return h.baseY + h.sink;
  return h.baseY + Math.sin(T*0.04 + h.seed)*1.6;
}
const hippoActive = h => !(h.type === 'sink' && h.gone > 0);

function startLevel(n){
  game.level = n;
  const lv = LEVELS[n];
  game.hippos = [ makeHippo(40, 108, 3, 'calm') ];
  game.since = 0; game.made = 0;
  game.pickups = [];
  game.inv = 0;
  game.flagDone = false;
  for (let i=0;i<12;i++) spawnNext();
  game.p = { x:52, y:92, vx:0, vy:0, onGround:false, face:1, walkT:0,
             coyote:0, buffer:0, lastSafe:{x:52,y:92} };
  game.dog = { x:52-120, y:108, t:0, angry:0 };
  cam.x = 0; cam.y = 0;
  particles = [];
  mode = 'run';
  Snd.play('river');
  clearPressed();
}

function spawnNext(){
  const lv = L();
  const prev = game.hippos[game.hippos.length-1];
  if (game.made >= lv.hippos){
    /* the flagpole platform closes out the run */
    if (prev.type !== 'flag'){
      const fp = makeHippo(prev.x + prev.w + 34, clamp(prev.baseY, 80, 116), 1, 'flag');
      fp.w = 96; fp.h = 40;
      game.hippos.push(fp);
    }
    return;
  }
  game.made++;
  game.since++;
  const rest = game.since >= 8;
  const scale = rest ? 3 : (Math.random() < 0.16 ? 3 : 2);
  /* height first: climbing eats into how far the jump can carry you */
  let dy = rest ? rnd(-8,8) : rnd(-22, 26);
  let y = clamp(prev.baseY + dy, 56, 124);
  dy = y - prev.baseY;
  const rise = Math.max(0, -dy);
  const reach = lv.run * 26;                       // conservative flat range
  const maxGap = clamp(reach * (1 - rise/58), 14, reach);
  const gap = rest ? rnd(16,24) : rnd(0.35, 0.85) * maxGap;
  const x = prev.x + prev.w + gap;
  let type = 'calm';
  if (!rest){
    const r = Math.random();
    if (game.made > 4 && r < 0.14 + 0.05*game.level) type = 'sink';
    else if (game.made > 6 && r < 0.34) type = 'bob';
  }
  if (rest) game.since = 0;
  game.hippos.push(makeHippo(x, y, scale, type));

  if (Math.random() < 0.85)
    game.pickups.push({ kind:'coin', x: prev.x + prev.w + gap/2, y: Math.min(prev.baseY,y) - rnd(16,30),
                        got:false, seed:rnd(0,10) });
  if (game.hp < MAXHEARTS && Math.random() < 0.10)
    game.pickups.push({ kind:'heart', x: x + 12, y: y - 26, got:false, seed:rnd(0,10) });
}

/* Put the hero back on something solid. Prefers the nearest platform that is
   genuinely standable at this instant; if the river has none left (everything
   nearby sank), it drops a fresh calm hippo in rather than looping forever. */
function respawnSafely(){
  const p = game.p;
  let best = null, bestD = 1e9;
  for (const h of game.hippos){
    if (!hippoActive(h)) continue;
    if (h.type === 'sink' && (h.sinking || h.gone > 0)) continue;
    const d = Math.abs((h.x + h.w/2) - p.x);
    if (d < bestD){ bestD = d; best = h; }
  }
  if (!best){
    best = makeHippo(Math.max(40, p.x - 24), 104, 3, 'calm');
    game.hippos.push(best);
    game.hippos.sort((a,b) => a.x - b.x);
  }
  p.x = best.x + best.w/2 - 8;
  p.y = hippoTop(best) - 16;
  p.vx = 0; p.vy = 0;
  p.onGround = true; p.coyote = 8; p.buffer = 0;
  p.lastSafe = { x:p.x, y:p.y };
}

function updateRun(){
  const lv = L(), p = game.p;

  /* stop once the flagpole is down, or this spins forever */
  while (game.hippos[game.hippos.length-1].type !== 'flag' &&
         game.hippos[game.hippos.length-1].x < cam.x + W + 220) spawnNext();
  game.hippos  = game.hippos.filter(h => h.x + h.w > cam.x - 150);
  game.pickups = game.pickups.filter(c => c.x > cam.x - 150);

  for (const h of game.hippos){
    if (h.type !== 'sink') continue;
    if (h.gone > 0){ h.gone--; h.sink = lerp(h.sink, 0, 0.08); if (h.gone===0) h.sink = 0; }
    else if (h.sinking){ h.sink += 0.55; if (h.sink > 30){ h.gone = 110; h.sinking = false; } }
    else if (h.sink > 0) h.sink = Math.max(0, h.sink - 0.35);
  }

  const accel = p.onGround ? 0.5 : 0.22;
  if (keys.left)       { p.vx = Math.max(p.vx - accel, -lv.run); p.face = -1; }
  else if (keys.right) { p.vx = Math.min(p.vx + accel,  lv.run); p.face =  1; }
  else p.vx *= p.onGround ? 0.72 : 0.94;

  if (hit('act') || hit('up')) p.buffer = 9;
  if (p.buffer > 0) p.buffer--;
  if (p.coyote > 0) p.coyote--;
  if (p.buffer > 0 && p.coyote > 0){
    p.vy = JUMP; p.buffer = 0; p.coyote = 0; p.onGround = false;
    Snd.sfxJump();
    spark(p.x+8, p.y+16, 5, '#dff3ff', 1.6, 14, 0.08);
  }
  if (!(keys.act || keys.up) && p.vy < -2.2) p.vy += 0.30;

  const prevFeet = p.y + 16;
  p.vy = Math.min(p.vy + GRAV, 9);
  p.x += p.vx; p.y += p.vy;

  let landed = false;
  for (const h of game.hippos){
    if (!hippoActive(h)) continue;
    const top = hippoTop(h);
    if (p.x+13 > h.x && p.x+3 < h.x + h.w && p.vy >= 0 && prevFeet <= top + 3 && p.y+16 >= top){
      p.y = top - 16; p.vy = 0; landed = true;
      if (h.type === 'sink' && !h.sinking && h.gone === 0){ h.sinking = true; Snd.sfxSink(); }
      if (!p.onGround){ spark(p.x+8, top+2, 6, '#cfeaff', 1.8, 16, 0.10); Snd.sfxLand(); }
      /* never remember a hippo that is about to sink out from under us */
      if (h.type !== 'sink') p.lastSafe = { x: h.x + h.w/2 - 8, y: h.baseY - 26 };
      if (h.type === 'flag' && !game.flagDone && p.x > h.x + 30){
        game.flagDone = true;
        mode = 'flag'; flagT = 0;
        Snd.stop(); Snd.sfxSelect();
      }
      break;
    }
  }
  p.onGround = landed;
  if (landed) p.coyote = 8;
  if (landed && Math.abs(p.vx) > 0.25) p.walkT++; else if (!landed) p.walkT = 0;

  for (const c of game.pickups){
    if (c.got) continue;
    if (dist(c.x, c.y, p.x+8, p.y+8) < 14){
      c.got = true;
      if (c.kind === 'coin'){ earnCoin(); Snd.sfxCoin(); spark(c.x,c.y,8,'#ffdf6e',2.2,20,0.06); }
      else { game.hp = Math.min(MAXHEARTS, game.hp+1); Snd.sfxHeart(); spark(c.x,c.y,10,'#ff8aa0',2.2,24,0.04); }
    }
  }

  /* the dog */
  const dg = game.dog;
  dg.t++;
  dg.x += game.p.x > 110 ? lv.dog : lv.dog*0.35;
  if (dg.x < p.x - 190) dg.x = p.x - 190;
  dg.y = lerp(dg.y, p.y + 4, 0.06);
  if (dg.angry > 0) dg.angry--;
  if (p.x - dg.x < 62 && dg.t % 52 === 0) Snd.sfxBark();
  if (game.inv === 0 && dg.x + 13 > p.x + 3 && dg.x < p.x + 14){
    hurt(); dg.x = p.x - 80; dg.angry = 40;
  }

  if (p.y > DROWN_Y){
    Snd.sfxSplash();
    spark(p.x+8, WATER_Y, 16, '#bde6ff', 3, 26, 0.12);
    hurt();
    respawnSafely();
    dg.x = Math.min(dg.x, p.x - 95);
  }

  if (game.inv > 0) game.inv--;
  cam.x = Math.max(cam.x, p.x - 88);
}

function drawWater(){
  ctx.fillStyle = '#2f7fc4'; ctx.fillRect(0, WATER_Y, W, H-WATER_Y);
  ctx.fillStyle = '#3e9bdc'; ctx.fillRect(0, WATER_Y, W, 5);
  ctx.fillStyle = '#bde6ff';
  for (let x=0;x<W;x+=4){
    const wy = WATER_Y + 1 + Math.sin((x + cam.x*0.6)*0.09 + T*0.09)*1.6;
    ctx.fillRect(x, Math.round(wy), 2, 1);
  }
  const rf = ((T*0.09)|0) % 4;
  for (let i=-1;i<W/16+2;i++){
    const x = Math.round(i*16 - ((cam.x*0.55 + T*0.25) % 16));

function drawFlagPlatform(h){
  const x = Math.round(h.x - cam.x), y = Math.round(h.baseY);
  const lv = L();
  ctx.fillStyle = lv.grass;  ctx.fillRect(x, y, h.w, h.h);
  ctx.fillStyle = lv.grass2; ctx.fillRect(x, y, h.w, 4);
  ctx.fillStyle = lv.grass3;
  for (let i=0;i<h.w;i+=7) ctx.fillRect(x+i+2, y+7, 3, 2);
  /* the pole */
  const px = x + h.w - 26;
  ctx.fillStyle = '#d8d8e0'; ctx.fillRect(px, y-58, 2, 58);
  ctx.fillStyle = '#8a8a98'; ctx.fillRect(px-3, y-62, 8, 5);
  const wave = Math.sin(T*0.12)*3;
  ctx.fillStyle = game.flagDone ? '#7dff9a' : '#ffd23a';
  ctx.beginPath();
  ctx.moveTo(px+2, y-56);
  ctx.lineTo(px+2+20+wave, y-50);
  ctx.lineTo(px+2, y-44);
  ctx.closePath(); ctx.fill();
  /* the hole you drop through, once the flag is claimed */
  if (game.flagDone){
    ctx.fillStyle = '#101018';
    ctx.beginPath(); ctx.ellipse(x + h.w/2, y+3, 16, 5, 0, 0, TAU); ctx.fill();
  }
}
function drawHippo(h){
  if (h.type === 'flag'){ drawFlagPlatform(h); return; }
  const top = hippoTop(h);
  const x = Math.round(h.x - cam.x), y = Math.round(top);
  const fr = ((T*0.03 + h.seed) | 0) % 2;
  ctx.globalAlpha = .18; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x + h.w/2, WATER_Y+6, h.w*0.5, 3, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  const sunk = h.type === 'sink' && (h.sinking || h.gone > 0);
  if (sunk) ctx.globalAlpha = clamp(1 - h.sink/34, .25, 1);
  blit(IMG.hippo, fr*17, 0, 17, 16, x, y, false, h.scale);
  ctx.globalAlpha = 1;
  if (h.type === 'sink' && !sunk){
    ctx.globalAlpha = .30; ctx.fillStyle = '#ffcf5a';
    ctx.fillRect(x+2, y-3, h.w-4, 2); ctx.globalAlpha = 1;
  }
}
function drawHero2D(){
  const p = game.p;
  if (game.inv > 0 && (T>>1)%2) return;
  const flip = p.face < 0, col = 3;
  if (!p.onGround)                 blit(skin('jump'), col*16, 0, 16, 16, p.x-cam.x, p.y, flip);
  else if (Math.abs(p.vx) > 0.25)  blit(skin('walk'), col*16, ((p.walkT>>2)%4)*16, 16, 16, p.x-cam.x, p.y, flip);
  else                             blit(skin('idle'), col*16, 0, 16, 16, p.x-cam.x, p.y, flip);
}
function drawRun(){
  drawSky();
  for (const h of game.hippos) drawHippo(h);
  drawWater();
  for (const c of game.pickups){
    if (c.got) continue;
    const y = c.y + Math.sin(T*0.08 + c.seed)*2.5;
    if (c.kind === 'coin'){
      const fr = ((T*0.16 + c.seed)|0) % 4;
      ctx.drawImage(IMG.coin2, fr*10, 0, 10, 10, Math.round(c.x-cam.x-5), Math.round(y-5), 10, 10);
    } else blit(IMG.heart, 4*16, 0, 16, 16, c.x-cam.x-8, y-8);
  }
  const dg = game.dog, dfr = (T>>3)%2;
  const dx = Math.round(dg.x-cam.x), dy = Math.round(dg.y);
  ctx.globalAlpha=.25; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(dx+8, dy+17, 7, 2.5, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha=1;
  blit(dg.angry>0 ? tint(IMG.dog,'#ff8a6a') : IMG.dog, dfr*16, 0, 16, 16, dx, dy);
  drawHero2D();
  drawParticles(cam.x, 0);
  drawTopBar();
  if (game.p.x - game.dog.x < 60 && (T>>3)%2) textCS('RUN!', 36, '#ff6a6a');
}

/* ---- the flag beat, then down the hole ---- */
function updateFlag(){
  flagT++;
  const p = game.p;
  p.vy = Math.min(p.vy + GRAV, 9); p.vx *= 0.86;
  p.x += p.vx; p.y += p.vy;
  const fp = game.hippos.find(h => h.type === 'flag');
  if (fp && p.y + 16 > fp.baseY){ p.y = fp.baseY - 16; p.vy = 0; }
  if (flagT === 40) Snd.sfxCoin();
  if (flagT > 100){ startDrop(); }
}
function drawFlag(){
  drawRun();
  ctx.fillStyle = 'rgba(0,0,0,'+clamp((flagT-70)/40,0,.7)+')';
  ctx.fillRect(0,0,W,H);
  if (flagT > 20) textCS('FLAG CAPTURED!', 44, '#ffd23a');
  if (flagT > 55) textCS('DOWN THE HOLE...', 56, '#ffffff');
}

/* =========================================================================
   ACT 2 — THE DROP  (through the giant cup rims)
   ========================================================================= */
const FOCAL = 210, NEARZ = 26, SHAFT_R = 118, RING_GAP = 150;

/* Each world's rims are made of something different. Order per theme:
   under-shadow, top face, lip highlight, inner shade, outline. */
const RIM_THEMES = [
  { name:'gold',     c:['#7a4a1e','#e0a338','#f6d783','#c98a2c','#5c3a12'] },
  { name:'stone',    c:['#3f4048','#8b8d96','#c3c6cf','#6a6c75','#2b2c32'] },
  { name:'ice',      c:['#3a6a86','#8fd0ea','#dff4ff','#5fa6c8','#28495e'] },
  { name:'bamboo',   c:['#3d5c22','#7fae3f','#b8dc7a','#5d8a2c','#283d16'] },
  { name:'bone',     c:['#6e6653','#ded3b4','#f6efd8','#b4a888','#4a4436'] },
  { name:'obsidian', c:['#241f38','#5a4f7e','#8a7cb4','#3f3760','#171325'] },
  { name:'coral',    c:['#7a3550','#d86a7e','#f5a8b4','#b04f66','#4e2033'] },
  { name:'iron',     c:['#2f3a4a','#6d7e94','#a4b4c8','#4d5c70','#1e2530'] },
  { name:'crimson',  c:['#5c1c26','#b23a46','#e07a80','#82242f','#3a1018'] }
];

/* How a rim's opening behaves. Later worlds mix in the livelier ones. */
function rimTypesFor(level){
  const pool = ['plain'];
  if (level >= 1) pool.push('drift');
  if (level >= 3) pool.push('orbit');
  if (level >= 5) pool.push('twin');
  if (level >= 7) pool.push('pulse');
  if (level >= 9) pool.push('orbit', 'twin');   // weight the busy ones later on
  return pool;
}

/* Where the opening(s) actually are this frame, in shaft coordinates. */
function rimHoles(r){
  if (r.kind === 'twin'){
    const a = r.spin ? r.ang + T*r.spin : r.ang;
    const dx = Math.cos(a)*r.sep, dy = Math.sin(a)*r.sep;
    return [{ x:r.hx+dx, y:r.hy+dy, r:r.hr }, { x:r.hx-dx, y:r.hy-dy, r:r.hr }];
  }
  if (r.kind === 'orbit'){
    const a = r.ang + T*r.spin;
    return [{ x:Math.cos(a)*r.orb, y:Math.sin(a)*r.orb, r:r.hr }];
  }
  if (r.kind === 'drift'){
    return [{ x:r.hx + Math.sin(T*r.spin + r.ang)*r.amp, y:r.hy, r:r.hr }];
  }
  if (r.kind === 'pulse'){
    return [{ x:r.hx, y:r.hy, r:r.hr * (1 + Math.sin(T*r.spin + r.ang)*0.30) }];
  }
  return [{ x:r.hx, y:r.hy, r:r.hr }];
}
const drop = {};
function startDrop(){
  const lv = L();
  drop.px = 0; drop.py = 0; drop.vx = 0; drop.vy = 0;
  drop.z = 0; drop.speed = 2.0;
  drop.rings = []; drop.cups = []; drop.clouds = [];
  const pool = rimTypesFor(game.level);
  for (let i=0;i<lv.rims;i++){
    let hr = Math.max(38, 56 - i*1.6);
    const a = rnd(0,TAU), d = rnd(0, SHAFT_R - hr - 16);
    /* the first rim of a level is always a plain one, to read the pattern */
    const kind = i === 0 ? 'plain' : pool[(Math.random()*pool.length)|0];
    if (kind === 'twin') hr *= 0.80;             // two smaller mouths
    const sep = kind === 'twin' ? rnd(34, 52) : 0;
    const orb = kind === 'orbit' ? clamp(SHAFT_R - hr - 20, 18, 62) : 0;
    const amp = kind === 'drift' ? rnd(20, 40) : 0;
    const spin = kind === 'orbit' ? rnd(0.012, 0.026) * (Math.random()<0.5?-1:1)
               : kind === 'drift' ? rnd(0.020, 0.038)
               : kind === 'pulse' ? rnd(0.030, 0.050)
               : kind === 'twin'  ? (Math.random()<0.45 ? rnd(0.006,0.014)*(Math.random()<0.5?-1:1) : 0)
               : 0;
    /* keep a drifting or twin mouth inside the shaft */
    let hx = Math.cos(a)*d, hy = Math.sin(a)*d;
    const room = SHAFT_R - hr - 14;
    if (kind === 'drift'){ hx = clamp(hx, -(room-amp), room-amp); hy = clamp(hy, -room, room); }
    if (kind === 'twin'){  const rr = room - sep; hx = clamp(hx, -rr, rr); hy = clamp(hy, -rr, rr); }
    drop.rings.push({ z:(i+1)*RING_GAP, hx, hy, hr, kind, ang:a, sep, orb, amp, spin,
                      done:false, broke:0 });
    const aa = rnd(0,TAU), dd = rnd(10, SHAFT_R-30);
    drop.cups.push({ z:(i+1)*RING_GAP - RING_GAP*0.5, x:Math.cos(aa)*dd, y:Math.sin(aa)*dd, got:false });
  }
  drop.endZ = lv.rims*RING_GAP + 200;
  drop.theme = RIM_THEMES[game.level % RIM_THEMES.length].c;
  for (let i=0;i<24;i++) drop.clouds.push({ x:rnd(-200,200), y:rnd(-140,140), z:rnd(40,1900), r:rnd(16,44) });
  mode = 'drop';
  particles = [];
  Snd.play('sky');
}
const projScale = dz => FOCAL/(dz+NEARZ);

function updateDrop(){
  const ax = 0.42;
  if (keys.left)  drop.vx -= ax;
  if (keys.right) drop.vx += ax;
  if (keys.up)    drop.vy -= ax;
  if (keys.down)  drop.vy += ax;
  drop.vx *= 0.90; drop.vy *= 0.90;
  drop.px += drop.vx; drop.py += drop.vy;
  const d = Math.hypot(drop.px, drop.py), lim = SHAFT_R - 16;
  if (d > lim){
    const a = Math.atan2(drop.py, drop.px);
    drop.px = Math.cos(a)*lim; drop.py = Math.sin(a)*lim;
    drop.vx *= -0.35; drop.vy *= -0.35;
  }
  drop.speed = Math.min(4.4, drop.speed + 0.0022);
  drop.z += drop.speed;
  if (game.inv > 0) game.inv--;

  for (const r of drop.rings){
    if (r.done){ if (r.broke>0) r.broke--; continue; }
    if (drop.z >= r.z){
      r.done = true;
      const holes = rimHoles(r);
      if (holes.some(h => dist(drop.px, drop.py, h.x, h.y) < h.r - 7)){
        Snd.sfxCoin(); spark(W/2, H/2, 10, '#ffe9a8', 3, 20);
      } else {
        r.broke = 22;
        drop.speed = Math.max(1.6, drop.speed - 1.1);
        addShake(7); Snd.sfxHurt(); hurt();
        spark(W/2, H/2, 18, '#ffd0a0', 4, 26);
        /* shove toward whichever mouth was closest */
        let near = holes[0], nd = 1e9;
        for (const h of holes){ const d2 = dist(drop.px, drop.py, h.x, h.y); if (d2 < nd){ nd = d2; near = h; } }
        const a = Math.atan2(near.y-drop.py, near.x-drop.px);
        drop.vx += Math.cos(a)*2.6; drop.vy += Math.sin(a)*2.6;
        if (mode !== 'drop') return;
      }
    }
  }
  for (const c of drop.cups){
    if (c.got) continue;
    if (drop.z >= c.z){
      c.got = true;
      if (dist(drop.px, drop.py, c.x, c.y) < 32){
        game.cups++; wallet += CUP_VALUE;
        Snd.sfxCoin(); spark(W/2,H/2,12,'#ffdf6e',3,26);
      }
    }
  }
  if (drop.z >= drop.endZ){ mode = 'landing'; landT = 0; Snd.stop(); Snd.sfxLand(); addShake(8); }
}

function ring(cx, cy, R, hx, hy, HR, col){
  ringMulti(cx, cy, R, [{x:hx, y:hy, r:HR}], col);
}
/* an annulus with any number of openings punched out of it */
function ringMulti(cx, cy, R, holes, col, holeScale){
  if (R <= 0) return;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(cx+R, cy); ctx.arc(cx, cy, R, 0, TAU);
  for (const h of holes){
    const hr = h.r * (holeScale === undefined ? 1 : holeScale);
    if (hr <= 0) continue;
    ctx.moveTo(h.x+hr, h.y); ctx.arc(h.x, h.y, hr, 0, TAU);
  }
  ctx.fill('evenodd');
}
function shadeCol(near, far, t){
  const pc = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a = pc(near), b = pc(far);
  return 'rgb('+[0,1,2].map(i=>Math.round(lerp(b[i],a[i],t))).join(',')+')';
}
function drawDrop(){
  const lv = L();
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,lv.sky[0]); g.addColorStop(.45,lv.sky[1]); g.addColorStop(1,lv.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  for (const c of drop.clouds){
    let dz = c.z - drop.z;
    if (dz < 6){ c.z += 1900; dz = c.z - drop.z; }
    if (dz > 1900) continue;
    const s = projScale(dz);
    const x = W/2 + (c.x - drop.px)*s, y = H/2 + (c.y - drop.py)*s, r = c.r*s;
    if (r < 1) continue;
    ctx.globalAlpha = clamp(1 - dz/1900, 0, .85);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(x, y, r, r*0.42, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  const dzIsl = drop.endZ - drop.z;
  if (dzIsl < 900){
    const s = projScale(dzIsl);
    const x = W/2 - drop.px*s, y = H/2 - drop.py*s, r = 150*s;
    ctx.fillStyle = lv.grass3;
    ctx.beginPath(); ctx.ellipse(x, y+r*0.16, r*0.95, r*0.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = lv.grass;
    ctx.beginPath(); ctx.ellipse(x, y, r, r*0.52, 0, 0, TAU); ctx.fill();
  }
  const list = drop.rings.map(r => ({ r, dz:r.z - drop.z }))
                         .filter(o => o.dz > -30 && o.dz < 1250)
                         .sort((a,b) => b.dz - a.dz);
  const th = drop.theme || RIM_THEMES[0].c;
  for (const o of list){
    const r = o.r, dz = Math.max(o.dz,-30), s = projScale(dz);
    const cx = W/2 - drop.px*s, cy = H/2 - drop.py*s;
    const R = SHAFT_R*s;
    if (R < 2) continue;
    const sh = clamp(1 - dz/1250, 0, 1), broke = r.broke > 0;
    const lift = Math.max(1, 3*s*0.35);
    const proj = rimHoles(r).map(h => ({ x: W/2 + (h.x - drop.px)*s,
                                         y: H/2 + (h.y - drop.py)*s,
                                         r: h.r*s }));
    const under = proj.map(h => ({ x:h.x, y:h.y+lift, r:h.r }));
    ringMulti(cx, cy+lift, R, under, shadeCol(th[0], '#241a10', sh));
    ringMulti(cx, cy, R,        proj, broke ? '#ffb9b9' : shadeCol(th[1], '#4a3414', sh));
    ringMulti(cx, cy, R*0.94,   proj, broke ? '#ffe0e0' : shadeCol(th[2], '#6a4e1e', sh), 0.99);
    ringMulti(cx, cy, R*0.80,   proj, broke ? '#ff9d9d' : shadeCol(th[3], '#463010', sh), 1.02);
    ctx.strokeStyle = broke ? '#fff' : shadeCol(th[4], '#1e1408', sh);
    ctx.lineWidth = Math.max(1, 2*s);
    for (const h of proj){ ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.stroke(); }
    if (!r.done && o.dz < 520 && o.dz > 40){
      ctx.globalAlpha = clamp((520-o.dz)/520,0,1)*(0.55+0.45*Math.sin(T*0.16));
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      for (const h of proj){ ctx.beginPath(); ctx.arc(h.x, h.y, h.r+3, 0, TAU); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
  }
  for (const c of drop.cups){
    if (c.got) continue;
    const dz = c.z - drop.z;
    if (dz < 4 || dz > 900) continue;
    const s = projScale(dz);
    const x = W/2 + (c.x - drop.px)*s, y = H/2 + (c.y - drop.py)*s + Math.sin(T*0.08+c.z)*3;
    const sc = clamp(s*1.5, 0.6, 4);
    ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(sc, sc);
    ctx.globalAlpha = clamp(1-dz/900,0,1);
    ctx.drawImage(IMG.cup, -IMG.cup.width/2, -IMG.cup.height/2);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 1;
  for (let i=0;i<14;i++){
    const a = (i*2.39 + T*0.02) % TAU, rr = 34 + ((i*37 + T*7) % 120);
    const x = W/2 + Math.cos(a)*rr, y = H/2 + Math.sin(a)*rr, len = 4 + drop.speed*2.2;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*len*0.5, y+Math.sin(a)*len*0.5); ctx.stroke();
  }
  drawParticles(0,0);
  ctx.save();
  ctx.translate(W/2, H/2 + Math.sin(T*0.18)*1.2);
  ctx.scale(1.7,1.7); ctx.rotate(drop.vx*0.05);
  const src = (game.inv>0 && (T>>1)%2) ? tint(skin('jump'),'#ffffff') : skin('jump');
  ctx.drawImage(src, 0,0,16,16, -8,-8,16,16);
  ctx.restore();
  drawTopBar();
  const left = drop.rings.filter(r => !r.done).length;
  textS('RIMS '+left, 150, 3, '#ffe9a8');
  const nxt = drop.rings.find(r => !r.done);
  if (nxt && nxt.kind !== 'plain') textCS(nxt.kind.toUpperCase(), 34, '#bff0ff');
}

function updateLanding(){
  landT++;
  if (landT === 50) Snd.sfxRoar();
  if (landT > 120) startBoss();
}
function drawLanding(){
  drawArena();
  ctx.globalAlpha = clamp(1 - landT/30, 0, 1);
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 1;
  blit(IMG.shadow,0,0,12,7, W/2-6, H/2+8);
  blit(skin('idle'),0,0,16,16, W/2-8, H/2-8);
  if (landT > 26) textCS(L().name, 30, '#ffe9a8');
  if (landT > 60) textCS('SOMETHING IS COMING...', 118, '#ff9a9a');
}

/* =========================================================================
   ACT 3 — THE BOSS
   ========================================================================= */
const AW = 320, AH = 208;
const BOUND = { x0:18, y0:18, x1:AW-18, y1:AH-18 };
let hero = {}, boss = {}, groundCv = null, groundLevel = -1;

function startBoss(){
  const def = BOSSDEF[L().boss];
  hero = { x:AW/2, y:AH-50, dir:0, walkT:0, stars:[], cool:0, kx:0, ky:0 };
  boss = { def, hp:def.hp, maxhp:def.hp, x:AW/2, y:70,
           tx:AW/2, ty:70, retarget:0, shootT:90, inv:0, flash:0,
           bobT:0, hopT:0, balls:[], intro:60,
           a:Math.PI/2, trail:[], segs:7, gap:22 };
  if (def.segmented) for (let i=0;i<220;i++) boss.trail.push({x:boss.x,y:boss.y,a:boss.a});
  cam.x = clamp(hero.x-W/2, 0, AW-W);
  cam.y = clamp(hero.y-H/2, 0, AH-H);
  particles = [];
  mode = 'boss';
  Snd.play('boss');
}

function buildGround(){
  const lv = L();
  groundCv = document.createElement('canvas');
  groundCv.width = AW; groundCv.height = AH;
  const g = groundCv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.fillStyle = lv.grass; g.fillRect(0,0,AW,AH);
  for (let y=0;y<AH;y+=2) for (let x=0;x<AW;x+=2){
    const n = Math.sin(x*0.21)*Math.cos(y*0.17) + Math.sin((x+y)*0.09);
    if (n > 0.65){ g.fillStyle = lv.grass2; g.fillRect(x,y,2,2); }
    else if (n < -0.75){ g.fillStyle = lv.grass3; g.fillRect(x,y,2,2); }
  }
  for (let i=0;i<150;i++){
    const x=(Math.random()*AW)|0, y=(Math.random()*AH)|0;
    g.fillStyle = lv.grass3;
    g.fillRect(x,y,1,2); g.fillRect(x+2,y+1,1,2);
  }
  const B = 14;
  g.fillStyle = '#6c6355';
  g.fillRect(0,0,AW,B); g.fillRect(0,AH-B,AW,B); g.fillRect(0,0,B,AH); g.fillRect(AW-B,0,B,AH);
  g.fillStyle = '#857b69';
  for (let x=0;x<AW;x+=16){ g.fillRect(x+1,1,14,5); g.fillRect(x+1,AH-B+1,14,5); }
  for (let y=0;y<AH;y+=16){ g.fillRect(1,y+1,5,14); g.fillRect(AW-B+1,y+1,5,14); }
  g.fillStyle = '#4a4438';
  g.fillRect(0,B-2,AW,2); g.fillRect(0,AH-B,AW,2); g.fillRect(B-2,0,2,AH); g.fillRect(AW-B,0,2,AH);
  g.globalAlpha=.45; g.strokeStyle='#c9bfa6'; g.lineWidth=3;
  g.beginPath(); g.arc(AW/2, AH/2, 70, 0, TAU); g.stroke();
  g.beginPath(); g.arc(AW/2, AH/2, 56, 0, TAU); g.stroke();
  g.globalAlpha=1;
  groundLevel = game.level;
}
function drawArena(){
  if (!groundCv || groundLevel !== game.level) buildGround();
  ctx.drawImage(groundCv, -Math.round(cam.x), -Math.round(cam.y));
}

function bossParts(){
  const d = boss.def;
  if (!d.segmented) return [{ x:boss.x, y:boss.y, r:Math.max(d.fw,d.fh)*0.42 }];
  const parts = [{ x:boss.x, y:boss.y, r:22 }];
  for (let i=1;i<=boss.segs;i++){
    const t = boss.trail[Math.min(boss.trail.length-1, i*boss.gap)];
    if (t) parts.push({ x:t.x, y:t.y, r:16 });
  }
  const tl = boss.trail[Math.min(boss.trail.length-1, (boss.segs+1)*boss.gap)];
  if (tl) parts.push({ x:tl.x, y:tl.y, r:15 });
  return parts;
}

function damageBoss(hx, hy){
  boss.hp--; boss.inv = 20; boss.flash = 12;
  addShake(6); Snd.sfxHitBoss();
  spark(hx-cam.x, hy-cam.y, 14, '#bff0ff', 3.2, 24);
  if (boss.hp <= 0){
    boss.hp = 0;
    game.bounty = bossBounty(game.level);
    earnCoins(game.bounty);
    Snd.stop(); Snd.sfxWin(); addShake(10); flashWhite = 12;
    for (let i=0;i<40;i++) spark(hx-cam.x, hy-cam.y, 1, i%2?'#ffe9a8':'#bff0ff', 5, 60);
    mode = 'clear'; clearT = 0;
  }
}

function updateBossAct(){
  const d = boss.def;
  if (boss.intro > 0){ boss.intro--; }

  /* ---- hero ---- */
  let mx=0, my=0;
  if (keys.left) mx--; if (keys.right) mx++;
  if (keys.up) my--;   if (keys.down) my++;
  if (mx||my){
    const l = Math.hypot(mx,my); mx/=l; my/=l;
    hero.walkT++;
    hero.dir = Math.abs(mx) > Math.abs(my) ? (mx<0?2:3) : (my<0?1:0);
  } else hero.walkT = 0;
  hero.x += mx*1.4 + hero.kx;
  hero.y += my*1.4 + hero.ky;
  hero.kx *= 0.82; hero.ky *= 0.82;
  hero.x = clamp(hero.x, BOUND.x0+6, BOUND.x1-6);
  hero.y = clamp(hero.y, BOUND.y0+8, BOUND.y1-4);

  if (hero.cool > 0) hero.cool--;
  if (hit('act') && hero.cool === 0){
    hero.cool = 13;
    const dd = hero.dir, SS = 3.6;
    hero.stars.push({ x:hero.x + (dd===2?-6:dd===3?6:0), y:hero.y - 6 + (dd===1?-6:dd===0?6:0),
                      vx: dd===2?-SS:dd===3?SS:0, vy: dd===1?-SS:dd===0?SS:0, l:130, spin:0 });
    Snd.sfxStar();
  }
  if (game.inv > 0) game.inv--;
  cam.x = lerp(cam.x, clamp(hero.x-W/2, 0, AW-W), 0.14);
  cam.y = lerp(cam.y, clamp(hero.y-H/2, 0, AH-H), 0.14);

  /* ---- stars, gently homing ---- */
  for (const st of hero.stars){
    if (boss.hp > 0 && boss.intro === 0){
      let bestP=null, bd=1e9;
      for (const p of bossParts()){ const dd=dist(st.x,st.y,p.x,p.y); if(dd<bd){bd=dd;bestP=p;} }
      if (bestP && bd < 130){
        const want = Math.atan2(bestP.y-st.y, bestP.x-st.x);
        const cur  = Math.atan2(st.vy, st.vx);
        const da   = ((want-cur+Math.PI*3) % TAU) - Math.PI;
        const na   = cur + clamp(da, -0.10, 0.10);
        const sp   = Math.hypot(st.vx, st.vy) || 3.6;
        st.vx = Math.cos(na)*sp; st.vy = Math.sin(na)*sp;
      }
    }
    st.x += st.vx; st.y += st.vy; st.l--; st.spin += 0.55;
    if (st.x < BOUND.x0 || st.x > BOUND.x1 || st.y < BOUND.y0 || st.y > BOUND.y1) st.l = 0;
    if (st.l > 0 && boss.hp > 0 && boss.intro === 0 && boss.inv === 0){
      for (const p of bossParts()){
        if (dist(st.x, st.y, p.x, p.y) < p.r){ st.l = 0; damageBoss(p.x, p.y); break; }
      }
    }
  }
  hero.stars = hero.stars.filter(s => s.l > 0);
  if (mode !== 'boss') return;

  /* ---- boss movement ---- */
  if (boss.intro === 0 && boss.hp > 0){
    boss.bobT += 0.08;
    if (d.segmented){
      boss.retarget--;
      if (boss.retarget <= 0){
        boss.retarget = 80;
        if (Math.random() < 0.35){ boss.tx = hero.x; boss.ty = hero.y; }
        else { boss.tx = rnd(BOUND.x0+40, BOUND.x1-40); boss.ty = rnd(BOUND.y0+30, BOUND.y1-50); }
      }
      const want = Math.atan2(boss.ty-boss.y, boss.tx-boss.x);
      const da = ((want - boss.a + Math.PI*3) % TAU) - Math.PI;
      boss.a += clamp(da, -0.040, 0.040);
      boss.x += Math.cos(boss.a)*1.05;
      boss.y += Math.sin(boss.a)*1.05;
      if (boss.x < BOUND.x0+24 || boss.x > BOUND.x1-24){ boss.x = clamp(boss.x, BOUND.x0+24, BOUND.x1-24); boss.a = Math.PI - boss.a; boss.retarget = 0; }
      if (boss.y < BOUND.y0+20 || boss.y > BOUND.y1-30){ boss.y = clamp(boss.y, BOUND.y0+20, BOUND.y1-30); boss.a = -boss.a; boss.retarget = 0; }
      boss.trail.unshift({ x:boss.x, y:boss.y, a:boss.a });
      if (boss.trail.length > 260) boss.trail.pop();
    } else {
      boss.retarget--;
      if (boss.retarget <= 0){
        boss.retarget = d.hop ? 70 : 100;
        boss.tx = rnd(BOUND.x0+40, BOUND.x1-40);
        boss.ty = rnd(BOUND.y0+30, BOUND.y1-40);
        if (Math.random() < 0.4){ boss.tx = hero.x; boss.ty = hero.y; }
        if (d.hop) boss.hopT = 40;
      }
      if (d.hop && boss.hopT > 0) boss.hopT--;
      const spd = d.hop ? (boss.hopT > 0 ? 1.5 : 0.25) : 0.72;
      const a = Math.atan2(boss.ty-boss.y, boss.tx-boss.x);
      boss.x += Math.cos(a)*spd;
      boss.y += Math.sin(a)*spd;
      boss.x = clamp(boss.x, BOUND.x0+26, BOUND.x1-26);
      boss.y = clamp(boss.y, BOUND.y0+22, BOUND.y1-26);
    }
    boss.shootT--;
    if (boss.shootT <= 0){
      boss.shootT = d.shoot;
      const base = Math.atan2(hero.y-boss.y, hero.x-boss.x);
      boss.balls.push({ x:boss.x, y:boss.y, vx:Math.cos(base)*1.2, vy:Math.sin(base)*1.2, l:170, f:0 });
      Snd.tone(150, Snd.now(), .18, 'sawtooth', .10);
    }
  }
  if (boss.inv > 0) boss.inv--;
  if (boss.flash > 0) boss.flash--;

  for (const b of boss.balls){
    b.x += b.vx; b.y += b.vy; b.l--; b.f += 0.28;
    if (b.x < BOUND.x0 || b.x > BOUND.x1 || b.y < BOUND.y0 || b.y > BOUND.y1) b.l = 0;
    if (game.inv === 0 && dist(b.x,b.y,hero.x,hero.y-6) < 10){ b.l = 0; hurt(); }
  }
  boss.balls = boss.balls.filter(b => b.l > 0);
  if (mode !== 'boss') return;

  /* body contact — only the head of the serpent, or the whole simple boss */
  if (game.inv === 0 && boss.hp > 0 && boss.intro === 0){
    if (dist(hero.x, hero.y-6, boss.x, boss.y) < (d.segmented ? 18 : Math.max(d.fw,d.fh)*0.34)){
      hurt();
      const a = Math.atan2(hero.y-boss.y, hero.x-boss.x);
      hero.kx = Math.cos(a)*3.4; hero.ky = Math.sin(a)*3.4;
    }
  }
}

function drawBossAct(){
  drawArena();
  const ox = -Math.round(cam.x), oy = -Math.round(cam.y);
  const d = boss.def;
  const fl = boss.flash > 0 && (T>>1)%2 ? '#ffffff' : null;

  if (boss.hp > 0 || mode === 'clear'){
    if (d.segmented){
      const segs = [];
      for (let i=boss.segs;i>=1;i--){
        const t = boss.trail[Math.min(boss.trail.length-1, i*boss.gap)];
        if (t) segs.push({t,i});
      }
      ctx.globalAlpha=.28; ctx.fillStyle='#000';
      for (const s of segs){ ctx.beginPath(); ctx.ellipse(s.t.x+ox, s.t.y+oy+11, 11, 4, 0,0,TAU); ctx.fill(); }
      ctx.beginPath(); ctx.ellipse(boss.x+ox, boss.y+oy+13, 15, 5, 0,0,TAU); ctx.fill();
      ctx.globalAlpha=1;
      const bob = i => Math.sin(T*0.11 - i*0.6)*1.6;
      const tl = boss.trail[Math.min(boss.trail.length-1,(boss.segs+1)*boss.gap)];
      if (tl) blitRot(fl?tint(IMG.dTail,fl):IMG.dTail, 0,0,IMG.dTail.width,IMG.dTail.height,
                      tl.x+ox, tl.y+oy+bob(boss.segs+1), tl.a+Math.PI/2);
      for (const s of segs){
        const im = s.i%2 ? IMG.dBody1 : IMG.dBody2;
        blitRot(fl?tint(im,fl):im, 0,0, im.width, im.height, s.t.x+ox, s.t.y+oy+bob(s.i), s.t.a+Math.PI/2);
      }
      const flap = Math.sin(T*0.20);
      ctx.save();
      ctx.translate(Math.round(boss.x+ox), Math.round(boss.y+oy+bob(0)));
      ctx.rotate(boss.a - Math.PI/2);
      for (const side of [-1,1]){
        ctx.save();
        ctx.translate(side*16, -2);
        ctx.scale(side*(0.72+flap*0.28), 0.94+flap*0.10);
        const wi = fl?tint(IMG.dWing,fl):IMG.dWing;
        ctx.drawImage(wi, -IMG.dWing.width/2, -IMG.dWing.height/2);
        ctx.restore();
      }
      ctx.restore();
      blitRot(fl?tint(IMG.dHead,fl):IMG.dHead, 0,0, IMG.dHead.width, IMG.dHead.height,
              boss.x+ox, boss.y+oy+bob(0), boss.a - Math.PI/2);
    } else {
      const fr = ((T*0.10)|0) % d.n;
      const bob = Math.sin(boss.bobT)*2;
      ctx.globalAlpha=.28; ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(boss.x+ox, boss.y+oy+d.fh*0.42, d.fw*0.38, 4, 0,0,TAU); ctx.fill();
      ctx.globalAlpha=1;
      const im = fl ? tint(IMG[d.img], fl) : IMG[d.img];
      ctx.drawImage(im, fr*d.fw, 0, d.fw, d.fh,
                    Math.round(boss.x+ox-d.fw/2), Math.round(boss.y+oy-d.fh/2+bob), d.fw, d.fh);
    }
  }

  for (const b of boss.balls){
    blitRot(IMG.fireball, ((b.f|0)%4)*16, 0, 16, 16, b.x+ox, b.y+oy, Math.atan2(b.vy,b.vx)-Math.PI/2);
  }
  for (const st of hero.stars){
    blitRot(IMG.star, (((st.spin*2)|0)%2)*16, 0, 16, 16, st.x+ox, st.y+oy, st.spin);
  }

  if (!(game.inv > 0 && (T>>1)%2)){
    ctx.globalAlpha=.30; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(hero.x+ox, hero.y+oy+5, 6, 2.5, 0,0,TAU); ctx.fill();
    ctx.globalAlpha=1;
    const dx = hero.x+ox-8, dy = hero.y+oy-14;
    if (hero.walkT > 0) blit(skin('walk'), hero.dir*16, ((hero.walkT>>3)%4)*16, 16,16, dx,dy);
    else                blit(skin('idle'), hero.dir*16, 0, 16,16, dx,dy);
  }

  drawParticles(cam.x, cam.y);
  drawTopBar();

  const bw = 96, bx = (W-bw)/2, by = H-11;
  ctx.fillStyle='#101422'; ctx.fillRect(bx-2, by-2, bw+4, 8);
  ctx.fillStyle='#3a2030'; ctx.fillRect(bx, by, bw, 4);
  ctx.fillStyle='#5ad0ff'; ctx.fillRect(bx, by, Math.round(bw*(boss.hp/boss.maxhp)), 4);
  textS(d.name, bx+2, by-11, '#bff0ff');
  if (boss.intro > 0){
    textCS(d.name+'!', 44, '#ffe9a8');
    textCS('SPACE = NINJA STAR', 56, '#bff0ff');
  }
}

/* Ten characters in a 5x2 grid plus a BACK button, driven entirely by the
   arrow keys and Space so nothing hides behind an unlabelled key. */
const SHOP_COLS = 5;
const SHOP_BACK = SKINS.length;
function updateShop(){
  const before = shop.sel;
  if (hit('left'))  shop.sel = shop.sel === SHOP_BACK ? SKINS.length-1 : (shop.sel+SKINS.length-1)%SKINS.length;
  if (hit('right')) shop.sel = shop.sel === SHOP_BACK ? 0 : (shop.sel+1)%SKINS.length;
  if (hit('up')){
    if (shop.sel === SHOP_BACK) shop.sel = SKINS.length-1;
    else if (shop.sel >= SHOP_COLS) shop.sel -= SHOP_COLS;
    else shop.sel = SHOP_BACK;
  }
  if (hit('down')){
    if (shop.sel === SHOP_BACK) shop.sel = 0;
    else if (shop.sel < SHOP_COLS) shop.sel += SHOP_COLS;
    else shop.sel = SHOP_BACK;
  }
  if (shop.sel !== before) Snd.sfxSelect();
  if (shop.msgT > 0) shop.msgT--;

  if (hit('act')){
    if (shop.sel === SHOP_BACK){
      Snd.sfxSelect(); saveShop(); mode = 'title'; titleSel = 1; return;
    }
    const i = shop.sel, sk = SKINS[i];
    if (owned[i]){
      if (equipped === i){ shop.msg = 'ALREADY WEARING IT'; shop.msgT = 90; Snd.sfxSelect(); }
      else { equipped = i; saveShop(); shop.msg = 'EQUIPPED!'; shop.msgT = 90; Snd.sfxHeart(); }
    } else if (wallet >= sk.price){
      wallet -= sk.price; owned[i] = true; equipped = i; saveShop();
      shop.msg = 'UNLOCKED!'; shop.msgT = 110;
      Snd.sfxCoin(); flashWhite = 6;
      for (let k=0;k<18;k++) spark(W/2, 96, 1, '#ffd23a', 3, 46, 0.03);
    } else {
      shop.msg = 'NEED ' + (sk.price - wallet) + ' MORE COINS';
      shop.msgT = 100; Snd.sfxHurt();
    }
  }
  if (hit('start')){ Snd.sfxSelect(); saveShop(); mode = 'title'; titleSel = 1; }
}

function drawShop(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#161b33'); g.addColorStop(1,'#2c3560');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for (let i=0;i<30;i++){
    const x=(i*83+T*0.12)%W, y=(i*57)%H;
    ctx.globalAlpha = 0.10 + 0.14*Math.abs(Math.sin(i+T*0.02));
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x|0, y|0, 1, 1);
  }
  ctx.globalAlpha = 1;

  textCS('NINJA SHOP', 5, '#ffd23a');
  ctx.drawImage(IMG.coin2, ((T*0.16)|0)%4*10, 0, 10, 10, 82, 16, 10, 10);
  textS(String(wallet) + ' COINS', 95, 17, '#ffdf6e');

  const cw = 42, ch = 40, ox = Math.round((W - SHOP_COLS*cw)/2), oy = 31;
  for (let i=0;i<SKINS.length;i++){
    const cx = ox + (i%SHOP_COLS)*cw, cy = oy + ((i/SHOP_COLS)|0)*ch;
    const sel = shop.sel === i;

    ctx.fillRect(cx+2, cy, cw-4, ch-4);
    const img = IMG['skin'+i+'_idle'];
    if (img){
      if (owned[i]) ctx.drawImage(img, 0, 0, 16, 16, cx+cw/2-16, cy+3, 32, 32);
      else {
        ctx.globalAlpha = 0.75;
        ctx.drawImage(grey(img), 0, 0, 16, 16, cx+cw/2-16, cy+3, 32, 32);
        ctx.globalAlpha = 1;
      }
    }
    if (equipped === i){
      textS('ON', cx+cw/2-7, cy+ch-12, '#7dff9a');
    } else if (!owned[i]){
      const pr = String(SKINS[i].price);
      textS(pr, cx+cw/2-textW(pr)/2, cy+ch-12, wallet >= SKINS[i].price ? '#ffdf6e' : '#8b93ad');
    }
    if (sel){
      ctx.strokeStyle = (T>>3)%2 ? '#ffffff' : '#ffd23a';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx+2.5, cy+0.5, cw-5, ch-5);
    }
  }

  const bSel = shop.sel === SHOP_BACK;
  ctx.fillStyle = bSel ? 'rgba(255,210,58,.20)' : 'rgba(0,0,0,.25)';
  ctx.fillRect(78, 115, 84, 13);
  if (bSel){
    ctx.strokeStyle = (T>>3)%2 ? '#ffffff' : '#ffd23a';
    ctx.lineWidth = 1; ctx.strokeRect(78.5, 115.5, 83, 12);
  }
  textCS('BACK', 118, bSel ? '#ffffff' : '#bcd4f0');

  if (shop.sel !== SHOP_BACK){
    const sk = SKINS[shop.sel];
    textCS(sk.name, 134, '#ffffff');
    if (equipped === shop.sel) textCS('WEARING THIS ONE', 145, '#7dff9a');
    else if (owned[shop.sel])  textCS('SPACE TO WEAR IT', 145, '#bff0ff');
    else textCS(sk.price + ' COINS - SPACE TO BUY', 145, wallet >= sk.price ? '#ffdf6e' : '#ff9a9a');
  } else {
    textCS('SPACE TO GO BACK', 134, '#bcd4f0');
    textCS('COINS 1  -  GOLD CUPS 5', 145, '#ffdf6e');
  }
  if (shop.msgT > 0 && (shop.msgT>>2)%2) textCS(shop.msg, 104, '#ffd23a');
  drawParticles(0,0);
}

function newGame(from){
  game.hp = MAXHEARTS; game.coins = 0; game.cups = 0; game.inv = 0;

  startLevel(clamp(from || 0, 0, LEVELS.length-1));
}

function drawOver(){
  overT++;
  ctx.fillStyle = '#0d1220'; ctx.fillRect(0,0,W,H);
  if (overT > 12) textCS('YOU RAN OUT OF HEARTS', 44, '#ff6a6a');
  if (overT > 32){
    textCS('REACHED LEVEL '+(game.level+1)+' OF '+LEVELS.length, 62, '#ffffff');
    textCS('COINS  '+game.coins+'    CUPS  '+game.cups, 74, '#ffdf6e');
    textCS('SCORE  '+score(), 88, '#ffe9a8');
  }
  if (overT > 52) textCS(score()>=best ? 'NEW BEST!' : 'BEST  '+best, 102, score()>=best?'#7dff9a':'#bcd4f0');
  if (overT > 74 && (overT>>4)%2) textCS('PRESS SPACE TO TRY AGAIN', 126, '#ffffff');
  if (overT > 74 && (hit('act')||hit('start'))){ Snd.sfxSelect(); newGame(); }
}

function drawVictory(){
  winT++;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a2a5a'); g.addColorStop(1,'#6f9ad8');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for (let i=0;i<50;i++){
    const x=(i*79+winT*0.6)%W, y=(i*47+winT*0.3)%H;
    ctx.globalAlpha=0.3+0.6*Math.abs(Math.sin(i+winT*0.05));
    ctx.fillStyle=['#ffd23a','#bff0ff','#ff8ad0'][i%3];
    ctx.fillRect(x|0,y|0,2,2);
  }
  ctx.globalAlpha=1;
  blit(skin('idle'), 0,0,16,16, W/2-8, 62+Math.sin(winT*0.07)*3);
  textCS('ALL '+LEVELS.length+' LEVELS BEATEN!', 24, '#ffd23a');
  textCS('YOU SAVED THE SKY KINGDOM', 36, '#ffe9a8');
  if (winT > 30){
    textCS('COINS  '+game.coins+'    CUPS  '+game.cups, 92, '#ffdf6e');
    textCS('SCORE  '+score(), 104, '#ffffff');
    textCS('HEARTS LEFT  '+game.hp, 114, '#ff8aa0');
  }
  if (winT > 80 && (winT>>4)%2) textCS('PRESS SPACE TO PLAY AGAIN', 138, '#ffffff');
  if (winT > 80 && (hit('act')||hit('start'))){ Snd.sfxSelect(); newGame(); }
  if (winT % 10 === 0) spark(rnd(20,W-20), rnd(20,H-40), 6, ['#ffd23a','#bff0ff','#ff8ad0'][winT%3], 3, 50);
}

/* =========================== main loop =========================== */
const crtEl = document.getElementById('crt');
function boot(){ document.getElementById('boot').style.display='none'; requestAnimationFrame(loop); }
let acc = 0, last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = now - last; last = now;
  if (dt > 200) dt = 200;
  acc += dt;
  const STEP = 1000/60;
  let guard = 0;
  while (acc >= STEP && guard++ < 5){ step(); acc -= STEP; }
  render();
}
function step(){
  T++;
  if (hit('mute')) Snd.toggle();
  if (hit('crt')) crtEl.classList.toggle('off');
  updateParticles();
  if (shake > 0){ shake *= 0.86; if (shake<0.3) shake=0; shakeX=rnd(-shake,shake); shakeY=rnd(-shake,shake); }
  else shakeX = shakeY = 0;
  if (flashWhite > 0) flashWhite--;
  if      (mode === 'run')     updateRun();
  else if (mode === 'flag')    updateFlag();
  else if (mode === 'drop')    updateDrop();
  else if (mode === 'landing') updateLanding();
  else if (mode === 'boss')    updateBossAct();
  else if (mode === 'clear')   updateClear();
  else if (mode === 'shop')    updateShop();
}
function render(){
  ctx.save();
  ctx.translate(Math.round(shakeX), Math.round(shakeY));
  ctx.fillStyle='#000'; ctx.fillRect(-10,-10,W+20,H+20);
  if      (mode === 'title')   drawTitle();
  else if (mode === 'run')     drawRun();
  else if (mode === 'flag')    drawFlag();
  else if (mode === 'drop')    drawDrop();
  else if (mode === 'landing') drawLanding();
  else if (mode === 'boss')    drawBossAct();
  else if (mode === 'clear')   drawClear();
  else if (mode === 'over')    drawOver();
  else if (mode === 'victory') drawVictory();
  else if (mode === 'shop')    drawShop();
  if (flashWhite > 0){
    ctx.globalAlpha = flashWhite/10; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  ctx.restore();
  clearPressed();
}
</script>
